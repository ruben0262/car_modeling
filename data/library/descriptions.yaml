# General descriptions of kinds of parts, shared by every vehicle.
#
# A part without its own `summary` gets the first entry whose `match` (a
# case-insensitive regular expression on the part name) fits, optionally
# limited to `kinds`. The viewer labels these as general descriptions, so
# they must stay true for any car: say what the part does and how, never
# vehicle-specific facts (those belong in the part's own summary, with a source).
descriptions:
  # ---------------------------------------------------------------- electrical: wiring
  - match: "^harness branch"
    text: "Short run of wires from a harness trunk to one component, ending in that component's connector."
  - match: "wheel speed sensor cable"
    text: "Shielded lead from a wheel speed sensor to the body harness. It is clipped along the suspension so it can follow the wheel's travel without stretching."
  - match: "battery positive cable|starter.*cable"
    text: "Heavy-gauge copper cable carrying battery current. It is protected by a high-current fuse at the battery end because the cable itself is unfused."
  - match: "ground cable|earth strap"
    text: "Heavy cable returning current from the body and engine to the battery negative terminal. A loose or corroded ground causes faults that look like failures in many unrelated systems."
  - match: "harness|branch"
    kinds: [harness]
    text: "Bundle of wires taped or sleeved together and clipped to the body. It carries power, ground and signal circuits between connectors, and its route keeps the wires away from heat, sharp edges and moving parts."

  # ---------------------------------------------------------------- electrical: power and modules
  - match: "terminal clamp"
    text: "Clamp that bolts the cable to the battery post; a loose or corroded clamp causes no-start and charging faults."
  - match: "battery case"
    text: "Polypropylene case holding the lead plates and electrolyte in separate cells, each producing about 2.1 V."
  - match: "battery terminal posts"
    text: "Lead posts the cable clamps fit on. Corrosion here adds resistance and causes slow cranking."
  - match: "battery cover"
    text: "Insulating cover that protects the battery and terminals from short circuits and heat."
  - match: "battery clamp"
    text: "Hold-down that stops the battery moving. A loose battery can short its terminals or crack the case."
  - match: "battery tray"
    text: "Support the battery sits in, bolted to the body."
  - match: "bjb housing|cjb housing|fuses and relays|housing and fuses"
    text: "Moulded box carrying fuses and plug-in relays, with connectors for the harnesses it feeds. The fuse-box lid usually shows what each position protects."
  - match: "ecm housing"
    text: "Sealed aluminium case of the engine control module; it carries the circuit boards and dissipates their heat."
  - match: "alarm sounder"
    text: "Alarm siren with its own back-up battery, so it keeps sounding if the vehicle's battery is disconnected."
  - match: "seat heating module"
    text: "Switches the seat heater elements on demand from the climate control and regulates their temperature with the thermistor."
  - match: "steering wheel, driver airbag"
    text: "Steering wheel assembly: the wheel, the driver airbag in the hub and the switch modules in the spokes, connected through the clockspring."
  - match: "abs electronic control"
    text: "Electronic module on the hydraulic unit that runs ABS, traction and stability control from the wheel speed and motion sensors."
  - match: "hydraulic control unit"
    text: "Valve block and pump that modulate brake pressure at each wheel for ABS and stability control."
  - match: "receiver/drier"
    text: "Container that stores liquid refrigerant and removes moisture with a desiccant."
  - match: "cooling fan"
    text: "Electric fan that pulls air through the radiator and condenser when the car is slow or stationary."
  - match: "blower motor"
    text: "Fan that pushes air through the heater casing into the cabin; its speed is controlled electronically."
  - match: "temperature control"
    text: "Climate control panel and module: reads the cabin sensors and the driver's settings and drives the flaps, blower and compressor."
  - match: "coupling housing"
    text: "Electronically controlled multi-plate clutch that sends drive to the rear axle when the control module asks for it."
  - match: "audio head unit"
    text: "Audio unit with radio and CD, and the controls for the infotainment system."
  - match: "parking aid module"
    text: "Control unit that drives the ultrasonic sensors, works out obstacle distances and makes the warning tones through the audio system."
  - match: "rf receiver"
    text: "Radio receiver for the remote handset's lock, unlock and alarm commands (and, where fitted, tyre pressure sensor signals)."
  - match: "intrusion"
    text: "Ultrasonic sensor that watches the cabin while the alarm is set and triggers it if something moves inside."
  - match: "rain and light sensor"
    text: "Optical sensor on the windscreen that sees raindrops (for automatic wipers) and ambient light (for automatic headlamps)."
  - match: "diagnostic socket"
    text: "Standard 16-pin OBD socket where a scan tool connects to read fault codes and live data from the vehicle's modules."
  - match: "light switch"
    text: "Rotary switch for the exterior lamps; the body control module reads its position and switches the lamps."
  - match: "start control"
    text: "Keyless start dock and button logic. It checks the key is authorised before the engine is allowed to crank."
  - match: "headlamp levelling module"
    text: "Reads the vehicle height sensors and drives the headlamp levelling motors so the beams stay at the right angle as the load changes."

  # ---------------------------------------------------------------- electrical: devices
  - match: "parking aid sensor"
    text: "Ultrasonic transducer in the bumper. It sends a short pulse and times the echo from an obstacle; the parking aid module turns the timings into distances and warning tones."
  - match: "door module"
    text: "Door control electronics with the window motor, lock and speaker. The module drives the window and lock and reads the door switches."
  - match: "speaker|tweeter|woofer"
    text: "Loudspeaker that turns the amplifier's signal into sound. Large cones reproduce low frequencies, small tweeters the high ones."
  - match: "amplifier"
    text: "Amplifies low-level audio or antenna signals before they reach the speakers or the tuner."
  - match: "antenna|aerial"
    text: "Antenna element that picks up broadcast or navigation signals; an amplifier next to it boosts the signal before the long cable run."
  - match: "seat .*motor|recline motor|lumbar pump"
    text: "Small permanent-magnet DC motor driving a seat adjuster. The switch or seat module reverses it by swapping the supply polarity."
  - match: "heater elements|heater mat"
    text: "Resistive heating mat under the seat cover. A thermistor lets the heating module regulate its temperature."
  - match: "sun visor"
    text: "Hinged visor that can swing to the windscreen or side window; its illuminated vanity mirror lamp switches on when the cover opens."
  - match: "interior lamp|footwell lamp|luggage compartment lamp|loadspace lamp|vanity|puddle"
    text: "Courtesy lamp switched by the body control module (or a door module), usually with a delayed fade-out after the doors close."
  - match: "cigar lighter|power socket"
    text: "12 V outlet for accessories, protected by its own fuse."

  # ---------------------------------------------------------------- body
  - match: "bumper cover"
    text: "Painted plastic cover over the bumper beam. It carries the parking sensors and lamp or grille openings and absorbs minor knocks."
  - match: "^radiator grille|\\bgrille$"
    text: "Opening in the front end that lets cooling air reach the radiator and charge-air cooler."
  - match: "^headlamp"
    text: "Headlamp unit with dipped and main beam, side lamp and indicator behind a common lens. Levelling motors aim it to suit the load."
  - match: "fog lamp"
    text: "Low-mounted lamp with a wide, flat beam for fog and heavy rain."
  - match: "wheel-arch liner"
    text: "Plastic shield inside the wheel arch that keeps stones, water and road dirt away from the body and engine bay."
  - match: "wheel-arch extension"
    text: "Plastic arch moulding that protects the paint around the wheel opening."
  - match: "windscreen \\("
    text: "Laminated safety glass (two glass layers bonded to a plastic interlayer) bonded into the body; it is part of the body's stiffness and supports the passenger airbag when it deploys."
  - match: "glass"
    text: "Toughened safety glass that breaks into small blunt pieces. Fixed glass is bonded in; door glass runs in channels and is moved by the window regulator."
  - match: "belt moulding|finisher|moulding"
    text: "Trim strip that covers or seals a joint and protects the paintwork."
  - match: "outer skin|outer panel|quarter panel|front wing|roof panel|corner panel|grille surround|roof side rail \\(outer\\)|a-pillar and roof side rail"
    text: "Exterior body panel, pressed steel or plastic, bolted or welded to the body structure. It forms the car's outer shape."
  - match: "roof rail"
    text: "Roof bar mounting that carries roof loads into the roof structure."
  - match: "^front door$|^rear door$"
    text: "Hinged door. Behind the trim, the inner frame carries the window, regulator, lock, speaker and door module; the outer skin is hemmed over the frame."
  - match: "^tailgate$"
    text: "Rear door hinged at the roof, held open by gas struts. It carries the rear screen, wiper, high-mounted stop lamp, number plate lamps and latch."
  - match: "wiper motor"
    text: "Electric motor with a worm gearbox and an internal park switch, so the wipers always stop in the rest position."
  - match: "wiper linkage"
    text: "Rods and cranks that turn the motor's rotation into the arms' back-and-forth sweep."
  - match: "wiper motor and linkage"
    text: "Wiper motor, linkage and pivots mounted as one unit below the windscreen."
  - match: "washer reservoir"
    text: "Tank for screen-washer fluid, with the electric washer pumps and a low-level sensor."
  - match: "filler flap release"
    text: "Small electric actuator that locks and unlocks the fuel filler flap with the central locking."

  - match: "exterior handle"
    text: "Outside door handle. Pulling it releases the latch through a rod or cable; the trim panel must come off to reach its fixings."
  - match: "window regulator"
    text: "Mechanism that raises and lowers the door glass, driven by an electric window motor."
  - match: "check strap"
    text: "Strap between the door and the pillar that holds the door open at set positions and stops it opening too far."
  - match: "trim panel"
    text: "Interior trim panel clipped over the inner panel. It hides the mechanisms, modules and harnesses behind it and is usually the first thing removed to reach them."
  - match: "high-mounted stop lamp"
    text: "Centre high-mounted brake lamp that lights together with the stop lamps."
  - match: "wiper arm"
    text: "Sprung arm that presses the blade onto the glass; it is splined to the wiper spindle and held by a nut."
  - match: "aperture seal|weatherstrip"
    text: "Rubber weatherstrip round an opening; the closed door or panel compresses it to keep water and wind noise out."
  - match: "striker"
    text: "Steel loop bolted to the body that the latch closes around."
  - match: "release handle"
    text: "Interior handle that pulls a cable to release a latch."
  - match: "oil separator"
    text: "Separates oil mist from crankcase or valve-cover vent gas and drains it back to the engine before the gas is returned to the intake."
  - match: "oil (feed|return) line"
    text: "Line carrying engine oil to or from the turbocharger bearings. The return drains by gravity, so it must not be kinked or blocked."

  # ---------------------------------------------------------------- body structure
  - match: "^(front|rear) longitudinal"
    text: "Main fore-aft rail of the monocoque body. It carries the subframe and suspension loads and is designed to crumple progressively in a crash."
  - match: "upper rail|apron"
    text: "Upper side member of the engine bay, linking the front end to the bulkhead and A-pillar."
  - match: "suspension turret"
    text: "Pressed steel tower that takes the top of the strut; the suspension loads enter the body here."
  - match: "bumper beam"
    text: "Steel crash beam behind the bumper cover. It spreads an impact into the longitudinals."
  - match: "front-end carrier"
    text: "Frame across the front of the engine bay that carries the cooling pack, bonnet lock and headlamps."
  - match: "plenum"
    text: "Panel below the windscreen that covers the plenum chamber where cabin intake air is drawn in."
  - match: "floor panel|rear-seat floor|luggage-compartment floor"
    text: "Floor pressing of the body. Ribs and cross-members stiffen it and it carries the seat and fuel tank mountings."
  - match: "tunnel"
    text: "Raised centre section of the floor that makes room for the exhaust and propshaft and stiffens the floor."
  - match: "sill"
    text: "Closed box section along the bottom of the door openings that ties the front and rear structure together and resists side impacts."
  - match: "pillar"
    text: "Roof pillar, a welded box section between the floor and the roof. It carries roof loads and side-impact forces, and hinges, belts and trim mount to it."
  - match: "cantrail|roof bows"
    text: "Roof frame members that stiffen the roof and support the headlining and roof panel."
  - match: "cross-member"
    text: "Cross-member that braces the floor and carries the seat mountings."
  - match: "cross-car beam"
    text: "Steel beam between the A-pillars that carries the instrument panel, steering column and airbags."

  # ---------------------------------------------------------------- interior
  - match: "glove"
    text: "Storage compartment in the passenger side of the instrument panel; it often hides fuse boxes or modules behind it."
  - match: "steering wheel"
    text: "Steering wheel with the driver airbag in the hub and remote switches in the spokes, connected to the column through the clockspring."
  - match: "airbag"
    text: "Folded fabric cushion with a gas inflator, fired by the restraints control module in a crash. Disconnect the battery and wait before working near any airbag."
  - match: "pretensioner"
    text: "Pyrotechnic device that pulls the seat belt tight in the first milliseconds of a crash."
  - match: "seat belt"
    text: "Three-point belt with an inertia-reel retractor that locks under sudden deceleration or rapid belt pull-out."
  - match: "pedal box"
    text: "Pedal assembly bolted to the bulkhead, with the brake pedal pushing the booster and the clutch pedal the clutch master cylinder."
  - match: "clutch pedal"
    text: "Pedal that operates the clutch master cylinder; its switches tell the engine control module when the clutch is pressed."
  - match: "brake pedal"
    text: "Pedal that pushes the booster pushrod; its switch turns on the stop lamps and tells the ABS and engine modules the brake is applied."
  - match: "accelerator pedal"
    text: "Drive-by-wire pedal: twin position sensors report the pedal position to the engine control module, which sets fuelling."
  - match: "^(front passenger|driver's|rear) seat\\b"
    text: "Seat frame on runners bolted to the floor, with foam cushions and trim cover."
  - match: "centre console"
    text: "Console over the transmission tunnel holding the gear lever, parking brake and switches, with modules and harnesses inside."
  - match: "terrain response"
    text: "Driver's rotary control for the terrain programs, with the stability control and hill descent buttons."

  # ---------------------------------------------------------------- engine
  - match: "cylinder block"
    text: "Main casting of the engine. It holds the cylinders, crankshaft bearings, coolant passages and oil galleries."
  - match: "cylinder head"
    text: "Casting that closes the top of the cylinders and carries the valves, camshafts, injectors and glow plugs."
  - match: "timing belt$"
    text: "Toothed belt that keeps the camshafts in time with the crankshaft. It must be renewed at the service interval; if it breaks, valves and pistons can collide."
  - match: "camshaft pulley"
    text: "Toothed pulley on the camshaft driven by the timing belt; its position sets the valve timing."
  - match: "timing belt.*tensioner"
    text: "Spring-loaded pulley that keeps the timing belt at the correct tension; set with the engine locked at its timing position."
  - match: "crankshaft pulley"
    text: "Pulley at the front of the crankshaft that drives the accessory belt; its rubber layer damps torsional vibration."
  - match: "belt.*tensioner"
    text: "Spring-loaded arm that keeps the accessory drive belt at the right tension automatically."
  - match: "idler"
    text: "Free-running pulley that guides the belt and increases its wrap around the driven pulleys."
  - match: "throttle body"
    text: "Electronically controlled flap in the intake. On a diesel it helps EGR flow and DPF regeneration, and shuts off the air when the engine stops to prevent shudder."
  - match: "compressor housing"
    text: "Cold side of the turbocharger, where the compressor wheel pushes intake air into the charge pipes."
  - match: "turbine housing"
    text: "Hot side of the turbocharger, where exhaust gas spins the turbine wheel."
  - match: "vane actuator"
    text: "Electric actuator that moves the turbocharger's variable vanes to control boost pressure."
  - match: "egr cooler"
    text: "Heat exchanger that cools recirculated exhaust gas with engine coolant before it re-enters the intake."
  - match: "egr valve"
    text: "Valve that lets a metered amount of exhaust gas back into the intake to lower combustion temperature and NOx emissions."
  - match: "high-pressure fuel pipes"
    text: "Rigid steel pipes carrying fuel at injection pressure. They are replaced, not re-used, once loosened."
  - match: "injector"
    text: "Electrically operated valve that sprays fuel at high pressure directly into the cylinder. The engine control module sets the timing and quantity of each injection."
  - match: "glow plug"
    text: "Heating element in the combustion chamber that helps cold starting and reduces smoke just after the engine starts."
  - match: "vacuum pump"
    text: "Engine-driven pump supplying vacuum to the brake booster; a diesel intake does not provide enough vacuum on its own."
  - match: "expansion valve"
    text: "Valve that meters liquid refrigerant into the evaporator, where it evaporates and cools the cabin air."
  - match: "thermostat housing|thermal control"
    text: "Temperature-controlled valve that keeps coolant in the engine until it warms up, then opens the path to the radiator."
  - match: "dipstick"
    text: "Gauge for checking the engine oil level with the engine stopped and level."
  - match: "oil pressure switch"
    text: "Switch that opens or closes when oil pressure is too low, lighting the oil pressure warning."
  - match: "oil temperature and level sensor"
    text: "Sensor in the sump that measures oil level (and temperature) for the instrument cluster warning."
  - match: "boost pressure sensor"
    text: "Measures intake manifold pressure so the engine control module can control turbo boost and fuelling."
  - match: "mass air flow"
    text: "Sensor in the intake measuring the mass of air entering the engine, used for fuelling and EGR control."
  - match: "intake air temperature"
    text: "Measures the temperature of the charge air so the engine control module can correct fuelling and boost."
  - match: "engine mount|transmission mount"
    text: "Rubber-bonded mount that carries the engine and gearbox and isolates their vibration from the body."
  - match: "crankshaft$"
    text: "Forged shaft that turns the pistons' up-and-down motion into rotation, running in main bearings in the block."
  - match: "pistons and connecting rods"
    text: "Pistons take the combustion pressure; the connecting rods pass it to the crankshaft."
  - match: "camshafts"
    text: "Shafts with lobes that open the intake and exhaust valves at the right moment in each cycle."
  - match: "oil pump"
    text: "Pump driven by the engine that circulates oil under pressure through the filter to the bearings and camshafts."
  - match: "a/c compressor"
    text: "Belt-driven pump that compresses refrigerant gas, the start of the air-conditioning cycle."

  # ---------------------------------------------------------------- transmission and driveline
  - match: "transmission casing"
    text: "Aluminium casing of the gearbox and clutch housing, bolted to the engine; it holds the gear shafts, differential and oil."
  - match: "reverse lamp switch"
    text: "Switch on the gearbox that closes when reverse is selected, turning on the reversing lamps."
  - match: "gear detection switch|neutral sensor"
    text: "Gearbox sensor that tells the engine control module which gear (or neutral) is selected."
  - match: "clutch cover"
    text: "Spring-loaded pressure plate that clamps the driven plate against the flywheel; pressing the pedal releases the clamp."
  - match: "slave cylinder"
    text: "Hydraulic cylinder around the gearbox input shaft that pushes the release bearing when the clutch pedal is pressed."
  - match: "rear drive unit"
    text: "Rear differential that splits drive between the two rear halfshafts and lets them turn at different speeds in corners."
  - match: "halfshaft"
    text: "Driveshaft from the differential to the wheel, with constant-velocity joints at each end so it can transmit torque while the suspension moves."
  - match: "shift cable"
    text: "Push-pull cable that carries gear-lever movement to the gearbox selector."
  - match: "clutch pressure pipe"
    text: "Pipe and hose carrying hydraulic pressure from the clutch master cylinder to the slave cylinder."
  - match: "reservoir hose|hose from .*reservoir"
    text: "Low-pressure hose feeding fluid from the reservoir to a master cylinder."

  # ---------------------------------------------------------------- suspension and steering
  - match: "top mount"
    text: "Rubber-bonded mount that fixes the top of the strut to the body; a front top mount also contains a bearing so the strut can turn with the steering."
  - match: "damper(?!.*top mount)"
    text: "Hydraulic shock absorber that controls spring movement so the wheel stays in contact with the road."
  - match: "coil spring"
    text: "Steel coil spring that carries the vehicle's weight and absorbs bumps."
  - match: "stabilizer bar link"
    text: "Short link with ball joints connecting the stabilizer bar to the suspension."
  - match: "stabilizer bar"
    text: "Torsion bar linking left and right suspension to reduce body roll in corners."
  - match: "height sensor"
    text: "Sensor with an arm on the suspension that reports ride height to the headlamp levelling system."
  - match: "tie rod"
    text: "Rod with a ball joint that carries steering rack movement to the steering arm on the knuckle; adjusting it sets the toe."
  - match: "intermediate shaft"
    text: "Universal-jointed shaft from the steering column to the rack pinion."
  - match: "power steering hoses"
    text: "Hoses carrying power-steering fluid between the pump, rack and reservoir; the high-pressure line runs at several thousand kPa."
  - match: "hub and bearing"
    text: "Wheel hub running on a sealed bearing in the knuckle; the wheel and brake disc bolt to it."

  # ---------------------------------------------------------------- brakes
  - match: "^front brake$|rear brake and parking brake"
    text: "Wheel brake: the caliper clamps pads against the disc to slow the wheel."
  - match: "dust shield|backplate"
    text: "Steel shield behind the disc that keeps road dirt off the braking surfaces; at the rear it also carries the parking brake shoes."
  - match: "caliper housing|^rear brake caliper"
    text: "Caliper body containing the piston; brake fluid pressure pushes the piston and clamps the pads onto the disc."
  - match: "fixed carrier"
    text: "Bracket bolted to the knuckle that holds the pads and guides the sliding caliper."
  - match: "brake pad"
    text: "Friction pad pressed against the disc. Replace it before the lining reaches its minimum thickness."
  - match: "caliper piston"
    text: "Piston pushed out by brake fluid pressure; its square-section seal also retracts it slightly when the brakes are released."
  - match: "bleed screw"
    text: "Valve for bleeding air out of the brake hydraulics."
  - match: "guide bolts"
    text: "Bolts the caliper slides on, sealed by boots; they must slide freely or the pads wear unevenly."
  - match: "flexible brake hose"
    text: "Reinforced rubber hose that lets the brake line follow steering and suspension movement."
  - match: "wheel speed sensor"
    text: "Active sensor that reads a magnetic encoder in the hub bearing and sends the wheel's speed to the ABS module."
  - match: "parking brake.*cable"
    text: "Steel cable in an outer sleeve that carries the parking brake lever's pull to the rear brakes."
  - match: "brake booster"
    text: "Vacuum servo between the pedal and master cylinder that multiplies the driver's pedal force."
  - match: "master cylinder"
    kinds: [part]
    text: "Tandem cylinder that turns pedal force into hydraulic pressure in two separate circuits."
  - match: "fluid reservoir"
    text: "Translucent reservoir for brake fluid with a level switch; the fluid absorbs water and must be renewed at the service interval."
  - match: "sensor cluster"
    text: "Yaw-rate and acceleration sensor near the car's centre of gravity, used by the stability control."

  # ---------------------------------------------------------------- wheels
  - match: "road wheel"
    text: "Wheel and tyre assembly, bolted to the hub with wheel nuts tightened in a diagonal sequence."
  - match: "tyre pressure sensor"
    text: "Battery-powered sensor inside the wheel that transmits tyre pressure and temperature by radio."
  - match: "^(front |rear |spare )?tyre\\b"
    text: "Pneumatic tyre. Its sidewall markings give the size, load index and speed rating."
  - match: "alloy wheel|wheel rim"
    text: "Cast aluminium wheel; the tyre seals on its bead seats."
  - match: "spare wheel"
    text: "Spare wheel and tyre stowed under the luggage floor."
  - match: "tpms initiator"
    text: "Low-frequency transmitter in the wheel arch that wakes the tyre pressure sensor in that wheel, so the system knows which wheel is which."

  # ---------------------------------------------------------------- cooling, climate and air intake
  - match: "^radiator$"
    text: "Heat exchanger in front of the engine where coolant gives up its heat to the air flowing through the fins."
  - match: "condenser"
    text: "Heat exchanger in front of the radiator where hot refrigerant gas condenses to liquid."
  - match: "expansion \\(header\\) tank"
    text: "Pressurised tank that takes up coolant expansion and lets air escape from the system. Do not open it while hot."
  - match: "radiator .*hose"
    text: "Coolant hose between the engine and the radiator."
  - match: "heater hoses"
    text: "Coolant hoses that carry hot coolant from the engine to the heater core."
  - match: "charge-air pipe"
    text: "Pipe carrying compressed intake air between the turbocharger, charge-air cooler and throttle."
  - match: "air cleaner housing"
    text: "Housing for the intake air filter with the inlet from the front of the car."
  - match: "air filter element"
    text: "Pleated paper element that removes dust from the intake air; renewed at the service interval."
  - match: "clean-air duct"
    text: "Duct carrying filtered air from the air cleaner to the turbocharger inlet."
  - match: "refrigerant pressure sensor"
    text: "Measures refrigerant pressure so the climate control can protect the compressor and switch the cooling fan."
  - match: "heater casing"
    text: "Housing behind the instrument panel holding the evaporator, heater core and the flaps that mix and direct the air."
  - match: "cabin air filter"
    text: "Filter that cleans the air entering the cabin of dust and pollen."

  # ---------------------------------------------------------------- fuel and exhaust
  - match: "fuel tank shell"
    text: "Fuel tank shell with its mounting cradle and heat shield. A saddle-shaped tank straddles the propshaft and exhaust."
  - match: "fuel supply line|fuel return line"
    text: "Fuel line between the tank and the engine; the return carries surplus fuel back to the tank."
  - match: "differential pressure sensor"
    text: "Measures the pressure drop across the particulate filter so the engine control module can tell how full of soot it is."
  - match: "oxygen sensor|ho2s"
    text: "Sensor in the exhaust that measures oxygen content, used to check combustion and emissions control."
  - match: "intermediate pipe"
    text: "Exhaust pipe joining the front section to the rear silencer, hung from rubber mounts."
  - match: "silencer"
    text: "Silencer that reduces exhaust noise with chambers and perforated tubes."

  # ---------------------------------------------------------------- generic fallbacks (keep last)
  - match: "connector|terminal clamp"
    kinds: [connector]
    text: "Plug-and-socket joint in the wiring. A locking housing holds numbered terminals, so a part can be replaced without cutting wires; pins are identified on the wiring diagram by connector id and pin number."
  - match: "relay"
    text: "Electrically operated switch. A small control current through its coil closes contacts that carry a much larger load current."
  - match: "module|control unit|\\becu\\b|computer|receiver|tuner"
    text: "Electronic control unit. It reads its sensors and switches, exchanges messages with other modules over the vehicle networks (CAN, LIN or MOST), and drives its outputs."
  - match: "switch pack|switch"
    text: "Switch that opens or closes a circuit (or changes a resistance) for a control module or relay to read."
  - match: "pipe"
    kinds: [pipe]
    text: "Rigid pipe carrying fluid between components, clipped to the body or subframe."

  # ---------------------------------------------------------------- added with the Ford Galaxy (VW-group parts)
  - match: "12 v socket|power outlet"
    text: "Socket supplying 12 V to accessories through its own fuse; a plug left in it can drain the battery if the socket is live with the ignition off."
  - match: "abs hydraulic pump"
    text: "Electric pump on the ABS hydraulic unit that returns brake fluid from the wheel brakes to the master cylinder side while the ABS is controlling, which is why the pedal pulses."
  - match: "^air cleaner$"
    text: "Housing with the engine's air filter element, taking air from a cold-air intake and passing it filtered to the engine."
  - match: "alarm horn|siren"
    text: "Loud horn of the anti-theft alarm, sounded by the alarm control unit when a monitored door, lid or the interior sensor is triggered."
  - match: "ultrasonic sensor"
    text: "Sends ultrasound into the cabin and listens to the echo; a change in the echo (movement inside the locked car) triggers the anti-theft alarm."
  - match: "balance weight"
    text: "Mass bolted to a mounting to tune out a vibration frequency of the engine and its mountings."
  - match: "bleed (valve|screw|nipple)"
    text: "Hollow screw that is opened to let air and old fluid out of a hydraulic circuit while it is bled; tighten it only lightly."
  - match: "bonnet hinge|hood hinge"
    text: "Hinge carrying the bonnet at its rear edge; its bolts set the bonnet's fit to the wings."
  - match: "bonnet lock|hood latch"
    text: "Latch holding the bonnet shut, released by a cable from inside the car, with a second safety catch that stops the bonnet flying open if the main latch lets go."
  - match: "brake carrier|caliper carrier|caliper bracket"
    text: "Bracket bolted to the wheel carrier that takes the braking force of the pads; the caliper slides on guide pins in it."
  - match: "pass-through|grommet"
    text: "Point where a harness passes through a body panel, sealed with a rubber grommet against water and noise."
  - match: "camshaft"
    text: "Shaft with one cam per valve, turned at half crankshaft speed by the timing drive, opening the valves through the tappets."
  - match: "centre housing with shaft"
    text: "Turbocharger core: the shaft joining the turbine and compressor wheels, running in oil-fed bearings at very high speed."
  - match: "reading light|reading lamp|interior light"
    text: "Interior lamp switched by its own switch or by the door contacts, often with a delayed switch-off when the doors close."
  - match: "centre stack|centre console|floor console"
    text: "Trim structure between the front seats and below the dash centre, carrying switches, controls and storage; removing it gives access to the harnesses and units on the tunnel."
  - match: "solenoid valve|control solenoid"
    text: "Electrically switched valve that admits vacuum or pressure to an actuator when the control unit energises it, often pulsed to give an intermediate position."
  - match: "charge-air (hoses|pipes)|boost hoses"
    text: "Pipes and hoses carrying compressed air from the turbocharger through the charge-air cooler to the intake manifold; a split hose causes a loss of boost and power."
  - match: "commencement of injection valve|timing (valve|solenoid)"
    text: "Solenoid valve on a distributor injection pump that adjusts when fuel is injected, under control of the engine control unit."
  - match: "cross member|crossbeam|cross-member"
    text: "Transverse structural member tying the body sides together and carrying parts mounted across the car."
  - match: "digital clock|^clock"
    text: "Electronic clock powered permanently from the battery; it loses the time when the battery is disconnected."
  - match: "evaporator"
    text: "Heat exchanger in the heater unit where the refrigerant evaporates and cools and dries the air blown into the cabin; condensed water drains out under the car."
  - match: "expansion tank hoses|coolant hoses"
    text: "Hoses connecting the coolant circuit to the expansion tank so that air is vented and coolant can expand and return."
  - match: "exterior mirror|door mirror|wing mirror"
    text: "Mirror housing on the door with an adjustable glass; electric versions carry adjustment motors and a heating element behind the glass."
  - match: "drop link|stabiliser link|coupling rod"
    text: "Short rod with a ball joint at each end connecting the anti-roll bar to the suspension; a worn link knocks over bumps."
  - match: "splash plate|dust shield|backing plate"
    text: "Thin plate behind the brake disc that shields it and the bearing from road dirt and water."
  - match: "bumper carrier|bumper bracket|crash beam"
    text: "Strong beam behind the bumper cover that takes impact loads into the longitudinal members."
  - match: "door lock|tailgate lock|door latch"
    text: "Latch engaging the striker on the body; the central locking actuator in it locks and unlocks it electrically."
  - match: "door window$|window glass|door glass"
    text: "Door window glass, raised and lowered by the window regulator inside the door."
  - match: "shaft strip|window seal|belt moulding"
    text: "Seal along the window opening of the door that wipes the glass as it moves and keeps water out of the door."
  - match: "seat cross member|seat crossmember"
    text: "Cross member in the floor that carries the seat mountings and stiffens the floor against side impacts."
  - match: "steel wheel|wheel rim|alloy wheel"
    text: "Wheel carrying the tyre, bolted to the hub; its width, diameter and offset are part of the car's approved fitments."
  - match: "strut mounting|strut tower|suspension tower"
    text: "Reinforced dome at the top of the wheel housing that takes the suspension strut's load into the body."
  - match: "turn signal bulb|indicator bulb|repeater"
    text: "Amber bulb flashed by the turn signal circuit; a failed bulb usually makes the remaining lamps flash at double speed."
  - match: "housing liner|wheel arch liner|arch liner"
    text: "Plastic liner inside the wheel housing that protects the body from stones, water and road salt."
  - match: "fuel filler flap|filler flap actuator"
    text: "Flap over the fuel filler neck; with central locking it is locked by a small actuator behind it."
  - match: "fuel filter cartridge|filter cartridge"
    text: "Replaceable filter element; on a diesel it also separates water, which collects at the bottom and is drained."
  - match: "preheating control valve|fuel preheating"
    text: "Thermostatic valve that routes warm return fuel back through the diesel filter in cold weather so that wax in the fuel cannot block the filter."
  - match: "fuel shut-off valve|stop solenoid"
    text: "Solenoid valve on a diesel injection pump that cuts off the fuel to stop the engine when the ignition is switched off."
  - match: "fuse holder|fuse box|fuses 51"
    text: "Holder for the plug-in fuses protecting individual circuits; fuse colours give the rating."
  - match: "gearbox mount|transmission mount|engine mount|hydraulic/rubber mount"
    text: "Rubber or fluid-filled mounting that carries the weight of the engine and gearbox and isolates their vibration from the body."
  - match: "guide pins"
    text: "Pins on which a floating brake caliper slides in its carrier, with rubber caps to keep the grease in and dirt out; seized pins cause uneven pad wear."
  - match: "washer pump"
    text: "Electric pump in the washer reservoir that delivers fluid to the washer jets when the wiper stalk is pulled."
  - match: "headlining|roof lining"
    text: "Trim panel lining the inside of the roof, carrying the interior lights, sun visors and grab handles."
  - match: "heat exchanger|heater core|heater matrix"
    text: "Small radiator in the heater unit through which hot engine coolant flows; the blower pushes cabin air through it."
  - match: "washer jet"
    text: "Nozzle spraying washer fluid onto the glass; a heated jet has a small element that stops the fluid freezing."
  - match: "heater (and evaporator )?casing|heater box|rear heat exchanger casing"
    text: "Plastic housing of the heater unit with the flaps that mix and direct the air to the vents."
  - match: "high-level brake light|third brake light"
    text: "Brake light at the top of the rear window, lit with the other brake lights, so that the drivers behind see the car braking."
  - match: "horn plate|horn button"
    text: "Contact in the steering wheel that switches the horn relay when the pad is pressed."
  - match: "injection pump body|distributor pump"
    text: "High-pressure pump of a diesel engine, driven by the timing belt, that meters and distributes fuel to each injector in the firing order."
  - match: "sprocket"
    text: "Toothed wheel driven by or driving the toothed timing belt; its position relative to the others sets the engine and injection timing."
  - match: "intake duct|air duct"
    text: "Duct carrying filtered air from the air cleaner to the turbocharger or intake; a split duct lets unfiltered air into the engine."
  - match: "temperature sender|temperature sensor"
    text: "Temperature-dependent resistor (NTC thermistor): its resistance falls as it warms, which the control unit or gauge reads as a temperature."
  - match: "luggage compartment floor|boot floor"
    text: "Floor panel of the luggage compartment, covering the spare wheel well or space below."
  - match: "luggage compartment light|boot light"
    text: "Lamp in the luggage compartment, switched on when the tailgate is opened."
  - match: "metering pump|dosing pump"
    text: "Small electromagnetic pump that delivers measured pulses of fuel to a fuel-fired heater."
  - match: "mirror adjustment motor"
    text: "Electric motors behind the mirror glass that tilt it vertically and horizontally from the switch in the door."
  - match: "number plate light|licence plate"
    text: "Lamps lighting the rear number plate, on with the side lights."
  - match: "catalytic converter|catalyst"
    text: "Canister with a coated ceramic or metal honeycomb in the exhaust that oxidises carbon monoxide, hydrocarbons and soot particles into less harmful gases."
  - match: "equaliser"
    text: "Bar that shares the handbrake lever's pull equally between the two rear cables; the cable adjustment is made here."
  - match: "pedal bracket|pedal box"
    text: "Bracket on the bulkhead carrying the pedals on a common pivot, with the switches that report pedal positions."
  - match: "pressure unit|wastegate actuator"
    text: "Diaphragm actuator that opens the turbocharger's bypass valve (wastegate) when worked by pressure or vacuum, limiting the boost."
  - match: "floor|floor panel"
    kinds: [part]
    text: "Floor pressing of the body shell; it carries the seats and is stiffened by the sills, tunnel and cross members."
  - match: "door warning lamp|entry light"
    text: "Lamps in the door trim: a red warning lamp on the door's edge, lit when the door is open, and an entry light shining onto the ground."
  - match: "rear lamp cluster|tail lamp|tail light"
    text: "Rear lamp unit with the tail, brake and turn signal bulbs behind a red and amber lens."
  - match: "warm air blower|blower with series resistor|fresh air blower"
    text: "Electric fan blowing air through the heater; a series resistor sets its lower speeds, so a burnt resistor leaves only the top speed working."
  - match: "refrigerant lines|a/c lines"
    text: "Aluminium pipes and hoses of the air-conditioning circuit; the high-pressure lines feel hot and the low-pressure lines cold when the system works."
  - match: "tensioning roller|tensioner"
    text: "Pulley that keeps a belt at the right tension; a worn bearing whines and a weak tensioner lets the belt slip or jump teeth."
  - match: "roof cross members|roof bows"
    text: "Cross members under the roof panel that stiffen it and tie the two roof frame side members together."
  - match: "seats"
    kinds: [part]
    text: "Passenger seats on floor mountings; removable or folding seats lock into floor fixtures."
  - match: "selector cable|shift cable"
    text: "Cable transmitting the gear lever's movements to the gearbox; a stretched or misadjusted cable makes gears hard to select."
  - match: "steering column lower shaft|intermediate shaft"
    text: "Shaft with universal joints connecting the steering column to the steering gear pinion; worn joints cause play or knocking in the steering."
  - match: "strut bearing|top mount"
    text: "Rubber mounting at the top of the strut with a ball bearing that lets the strut turn with the steering; a worn bearing clunks or grates when steering."
  - match: "side light bulb|position lamp|tail and brake light bulb"
    text: "Low-power bulb lit with the side lights; a twin-filament bulb also carries the brighter brake light filament."
  - match: "tailgate hinge"
    text: "Hinge at the top of the tailgate on the roof frame."
  - match: "toothed belt guard|timing belt cover|belt guard"
    text: "Plastic covers over the timing belt that keep out dirt and fingers; the upper part comes off to check the belt."
  - match: "trailer socket|tow bar socket"
    text: "Socket at the towing bracket supplying the trailer's lights; a switch in it cuts the car's rear fog light when a trailer is plugged in."
  - match: "wiring connector|in-line connector"
    text: "Plug-and-socket joint between two harness sections, so that a section can be removed or replaced."
  - match: "upper wheel housing longitudinal member|upper rail|apron"
    text: "Upper member running along the top of the front wheel housing, carrying the strut mounting area and the wing."
  - match: "level sender|level sensor"
    text: "Float or probe that reports the fluid level, lighting a warning lamp when the level is low."
