      https://www.adac.de/rund-ums-fahrzeug/autokatalog/marken-modelle/ford/galaxy/i/984955/
  - id: wikipedia-galaxy
    title: Ford Galaxy (Wikipedia)
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Ford_Galaxy
    type: other
    reliability: D
    accessed: 2026-10-26
    notes: Used only for what Ford changed on the shared platform (Ford-designed fascia with a Golf-derived instrument pack and VW switchgear; VW engines with Ford badges). Never the sole source of a technical fact.
