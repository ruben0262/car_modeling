      pp., shar_suspension_rus.pdf 9 pp., shar_steering_rus.pdf 4 pp., shar_el_body_rus.pdf 20 pp.), cited as
      "<file> p. N". Covers all three sister models with their specifications and torques; not an OEM document.
  - id: adac-galaxy-19tdi
    title: ADAC Autokatalog, Ford Galaxy 1.9 TDI GLX 66 kW (07/95 – 09/98) and 1.9 TDI Ghia (03/97 – 07/00)
    publisher: ADAC
    url: https://www.adac.de/rund-ums-fahrzeug/autokatalog/marken-modelle/ford/galaxy/i/984954/
    type: press
    reliability: C
    accessed: 2026-10-27
    notes: >-
      Galaxy-specific published data: length 4617 mm, width 1810 mm, height 1730 mm (Ghia 1762 mm), wheelbase 2835
      mm, turning circle 11.1 m, kerb weight 1720 kg, 70 L tank, 195/65 R15 T tyres (Ghia 215/55 R16); ABS, driver
