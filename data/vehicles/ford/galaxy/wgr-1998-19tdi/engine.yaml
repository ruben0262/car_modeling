# 1.9 TDI, VW engine code AHU (66 kW): the VW EA827-family four-cylinder diesel with direct injection,
# an electronically controlled distributor injection pump, turbocharger and charge-air cooler. The engine
# itself is the same in the Golf, Passat and Sharan, so engine-internal facts come from the VW engine
# manuals (vw-engine-mech is written for the Golf/Vento installation, vw-engine-b5 for the Passat); the
# injection system, its senders and the Sharan engine mounting come from the Sharan diesel manual
# (vw-diesel), and the engine mounting layout from ssp-169 p. 20. Torques of the Sharan engine and gearbox
# mountings are not in the documents in hand.
#
# Engine-local frame (every node under engine-assembly):
#   origin on the crankshaft axis at the flywheel face,
#   +X along the crank towards the timing-belt end, +Y towards the intake side, +Z along the cylinders.
# Installed transverse with the timing belt on the vehicle's right and the gearbox on the left; VW numbers
# the cylinders from the timing-belt end (No. 1 at x≈342, No. 4 at x≈78). The intake side faces the
# radiator and the exhaust side the bulkhead → rot [0, 0, -90]. The crank position (160 mm ahead of the
# front axle, 520 mm high, flywheel face 85 mm left of the centre line) and every external fitting position are estimated around the subframe, the
# longitudinal members and the bonnet line.
system: engine
defaults:
  verification:
    geometry: schematic
    placement: estimated
    facts: oem
    sources:
      - { ref: vw-engine-mech, locator: "pp. 7–8, 16–29" }

nodes:
  - id: engine-assembly
    kind: assembly
    name: Engine — 1.9 TDI 66 kW (VW AHU)
    aliases: [engine, motor, AHU, TDI, 1.9 TDI, diesel engine, EA827]
    summary: Transverse 1.9-litre four-cylinder turbodiesel with direct injection, one overhead camshaft and two valves per cylinder, an intermediate shaft driving the oil and vacuum pumps, and an electronically controlled distributor injection pump.
    function: Converts diesel fuel into torque at the crankshaft, delivered through the clutch and the 5-speed gearbox to the front wheels.
    location: { zone: engine-bay, text: "Transverse; timing belt at the right, gearbox at the left, intake side towards the radiator" }
    placement: { pos: [160, 85, 520], rot: [0, 0, -90] }
    explode: { dir: [0, 0, 1], dist: 0 }
    specs:
      - { label: Engine code, value: "AHU, built from 08.96 (replacing the 1Z, same output)", source: { ref: vw-engine-mech, locator: p. 8 } }
      - { label: Capacity, value: "1.9 l (1896 cm³); bore 79.5 mm × stroke 95.5 mm", source: { ref: vw-engine-mech, locator: p. 8 } }
      - { label: Output / torque, value: "66 kW (90 PS) at 4000 rpm; 202 Nm at 1900 rpm", source: { ref: vw-engine-mech, locator: p. 8 } }
      - { label: Compression ratio, value: "19.5 : 1", source: { ref: vw-engine-mech, locator: p. 8 } }
      - { label: Firing order, value: "1-3-4-2 (No. 1 at the timing-belt end)", source: { ref: vw-engine-mech, locator: p. 8 } }
      - { label: Idling speed, value: "861–945 rpm (engine warm, coolant at least 80 °C)", source: { ref: vw-diesel, locator: p. 25 } }
      - { label: Fuel, value: "Diesel, cetane number at least 49", source: { ref: vw-engine-mech, locator: p. 8 } }
      - { label: Engine oil, value: "VW standard 505 00 (turbo diesel)", source: { ref: vw-engine-mech, locator: p. 88 } }
      - { label: Engine number, value: "On the cylinder block between the injection pump and the vacuum pump; also on a sticker on the toothed belt guard and on the vehicle data plate", source: { ref: vw-engine-mech, locator: p. 7 } }
    manufacturing:
      - { label: Systems, value: "Turbocharger with charge-air cooling, exhaust gas recirculation, oxidation catalyst", source: { ref: vw-engine-mech, locator: p. 8 } }
      - { label: Engine management, value: "Electronic Diesel Control (EDC): control unit J248 behind the dash panel insert", source: { ref: vw-diesel, locator: p. 46 } }
    verification:
      notes: "Engine data, numbering and the timing-end layout are from the manuals; the installed position is estimated."
      sources: [{ ref: vw-engine-mech, locator: "pp. 7–8" }, { ref: ssp-169, locator: p. 19, says: "1,9l-TDI-Motor: 1896 cm³, Bohrung 79,5 mm, Hub 95,5 mm, Verdichtung 19,5:1, 66 kW (90 PS) bei 4000 1/min, 202 Nm bei 1900 1/min, EDC" }]

  # ---------------------------------------------------------------- castings
  - id: cylinder-block
    parent: engine-assembly
    kind: part
    name: Cylinder block with intermediate shaft
    aliases: [block, crankcase]
    summary: Cast-iron block; the intermediate shaft along its intake side is driven by the toothed belt and drives the oil pump and the vacuum pump. Oil spray jets cool the pistons.
    explode: { dir: [0, 0, -1], dist: 40 }
    specs:
      - { label: Piston cooling jets, value: "10 Nm, fitted with AMV 188 100 02", source: { ref: vw-engine-mech, locator: p. 93 } }
    verification: { sources: [{ ref: vw-engine-mech, locator: "pp. 21, 26, 93" }] }
    geometry: { gen: engine-block, len: 420, y: [-135, 150], z: [-90, 235], bores: [78, 166, 254, 342], boreR: 40 }

  - id: oil-sump
    parent: engine-assembly
    kind: part
    name: Oil sump
    aliases: [sump, oil pan]
    summary: Pressed-steel sump with a gasket (flanges coated with "D2"), baffle plate and oil pump suction pipe inside.
    access: { from: [underside], tools: [Drain-plug socket, Oil drain tray], notes: "Drain plug 30 Nm; sump bolts 20 Nm (the two rear bolts at the gearbox end need jointed spanner 3185).", sources: [{ ref: vw-engine-mech, locator: "pp. 92–93" }] }
    explode: { dir: [0, 0, -1], dist: 260 }
    specs:
      - { label: Drain plug, value: "30 Nm", source: { ref: vw-engine-mech, locator: p. 92 } }
      - { label: Sump bolts, value: "20 Nm", source: { ref: vw-engine-mech, locator: p. 92 } }
    verification: { sources: [{ ref: vw-engine-mech, locator: "pp. 92–93" }] }
    geometry: { gen: oil-sump, x: [20, 400], y: [-120, 135], z: [-235, -90], ladder: 14, plug: [120, -60] }

  - id: cylinder-head
    parent: engine-assembly
    kind: part
    name: Cylinder head
    aliases: [head]
    summary: Aluminium cross-flow head with one camshaft and hydraulic bucket tappets; injectors and glow plugs sit in the head. Renew the head gasket (choose by marking) and all coolant whenever the head comes off.
    explode: { dir: [0, 0, 1], dist: 140 }
    specs:
      - { label: Head bolts, value: "Renew; tighten and loosen in the set sequence", source: { ref: vw-engine-mech, locator: p. 24 } }
    verification: { sources: [{ ref: vw-engine-mech, locator: "pp. 23–25" }] }
    geometry: { gen: cylinder-head, len: 420, y: [-125, 140], z: [235, 350], ports: [78, 166, 254, 342] }

  - id: cam-cover
    parent: engine-assembly
    kind: part
    name: Cylinder head cover with oil filler cap and breather valve
    aliases: [rocker cover, valve cover, cam cover, oil filler]
    summary: Cover over the camshaft with the oil filler cap and the pressure-regulating valve of the crankcase breather (to the intake hose).
    access: { from: [bonnet], notes: "Cover nuts 10 Nm; renew the gasket if damaged.", sources: [{ ref: vw-engine-mech, locator: "pp. 23–24" }] }
    explode: { dir: [0, 0, 1], dist: 250 }
    verification:
      notes: "The position of the oil filler cap on the cover is estimated (the owner's booklet notes it varies with the engine version)."
      sources: [{ ref: vw-engine-mech, locator: "pp. 23–24" }, { ref: vw-owner-tips, locator: p. 32 }]
    geometry: { gen: cam-cover, len: 410, y: [-95, 110], z: [350, 405], filler: 290 }

  - id: crankcase-breather-heater
    parent: engine-assembly
    kind: part
    name: Crankcase breather heater element
    summary: Heater element in the crankcase breather line that stops it freezing.
    explode: { dir: [0, 1, 1], dist: 200 }
    ewd: [N79]
    verification: { sources: [{ ref: vw-wd-1997, locator: "No. 14/3", says: "N79 Heater element (crankcase breather)" }] }
    geometry: { gen: cyl, r: 16, h: 50, axis: x, pos: [200, 130, 425], mat: plastic-black }

  # ---------------------------------------------------------------- timing drive
  - id: timing-belt-cover
    parent: engine-assembly
    kind: part
    name: Toothed belt guard (upper, lower and rear parts)
    aliases: [timing belt cover, cam belt cover]
    explode: { dir: [1, 0, 0], dist: 260 }
    material: plastic-black
    verification: { sources: [{ ref: vw-engine-mech, locator: "pp. 18–21, items 6, 16, 26" }] }
    geometry:
      gen: prism
      plane: yz
      thickness: 36
      bevel: 4
      pos: [446, 0, 0]
      outline: [[-110, -70], [-110, 200], [-95, 430], [70, 460], [160, 360], [235, 250], [225, 130], [120, -40], [40, -105], [-60, -105]]

  - id: timing-drive
    parent: engine-assembly
    kind: assembly
    detail: true
    name: Camshaft and injection pump drive (toothed belt)
    summary: One toothed belt from the crankshaft drives the intermediate shaft, the injection pump and the camshaft, with a semi-automatic tensioning roller and an idler. The ribbed belt drives the coolant pump.
    explode: { dir: [1, 0, 0], dist: 140 }
    contacts: [timing-belt-cover, crank-pulley, cylinder-block, cylinder-head, injection-pump]
    access:
      from: [bonnet, wheel-arch-front-right]
      removeFirst: [accessory-belt]
      tools: [Setting bar 2065 A (camshaft), Pin 2064 (injection pump sprocket), Pin wrench Matra V159 (tensioner)]
      notes: "Take off the balance weight and the engine mounting bracket at the timing end first (refit: bolts -2- 20 Nm, then bolt -1- 55 Nm). Set TDC No. 1: the flywheel mark aligns with the casting on the bell housing, the setting bar fits the camshaft slot (centred with feeler gauges) and pin 2064 locks the pump sprocket. Release the camshaft sprocket from its taper through the hole in the rear guard. Turn the tensioner to the right until notch and raised mark align, lock nut 20 Nm; camshaft sprocket bolt 45 Nm."
      sources: [{ ref: vw-diesel, locator: "pp. 59–65" }, { ref: vw-engine-mech, locator: "pp. 33–37" }]
    verification:
      notes: "Belt order follows the manual's parts list; the sprocket centres are estimated."
      sources: [{ ref: vw-engine-mech, locator: "pp. 18–21, Part I" }]
  - id: timing-belt
    parent: timing-drive
    kind: part
    name: Toothed belt
    aliases: [cam belt, cambelt, timing belt]
    summary: Mark the direction of rotation before removing; check for wear; never kink it.
    explode: { dir: [1, 0, 0], dist: 80 }
    verification: { sources: [{ ref: vw-engine-mech, locator: "p. 18, Part I item 7" }] }
    geometry:
      gen: serpentine
      x: 470
      width: 25
      thickness: 4
      pulleys:
        - { y: 0, z: 0, r: 31 }
        - { y: 105, z: 70, r: 40 }
        - { y: 165, z: 215, r: 62 }
        - { y: 0, z: 392, r: 62 }
        - { y: -80, z: 270, r: 30, side: -1 }
        - { y: -62, z: 110, r: 25, side: -1 }
  - id: camshaft-sprocket
    parent: timing-drive
    kind: part
    name: Camshaft sprocket
    summary: Sits on a taper on the camshaft; bolt 45 Nm.
    explode: { dir: [1, 0, 0.3], dist: 120 }
    specs: [{ label: Bolt, value: "45 Nm", source: { ref: vw-engine-mech, locator: "p. 19, Part I items 11–12" } }]
    geometry: { gen: pulley, r: 60, w: 26, ribs: 0, mat: steel-zinc, pos: [470, 0, 392] }
  - id: injection-pump-sprocket
    parent: timing-drive
    kind: part
    name: Injection pump sprocket (single part)
    explode: { dir: [1, 0.4, 0], dist: 120 }
    specs: [{ label: Securing nut, value: "55 Nm", source: { ref: vw-diesel, locator: "p. 49, item 1" } }]
    verification: { sources: [{ ref: vw-engine-mech, locator: "p. 20, Part I item 17" }, { ref: vw-diesel, locator: p. 49 }] }
    geometry: { gen: pulley, r: 60, w: 26, ribs: 0, mat: steel-zinc, pos: [470, 165, 215] }
  - id: intermediate-shaft-sprocket
    parent: timing-drive
    kind: part
    name: Intermediate shaft sprocket
    explode: { dir: [1, 0.4, -0.3], dist: 120 }
    verification: { sources: [{ ref: vw-engine-mech, locator: "p. 21, Part I items 22, 25" }] }
    geometry: { gen: pulley, r: 38, w: 26, ribs: 0, mat: steel-zinc, pos: [470, 105, 70] }
  - id: crankshaft-sprocket
    parent: timing-drive
    kind: part
    name: Crankshaft toothed belt sprocket
    summary: Its central bolt is renewed every time (threads and shoulder free of oil and grease) and tightened to 90 Nm + 90°, counter-held with tool 3099.
    explode: { dir: [1, 0, -0.3], dist: 120 }
    specs: [{ label: Central bolt, value: "90 Nm + 1/4 turn (90°), renew", source: { ref: vw-engine-mech, locator: "p. 21, Part I item 24" } }]
    geometry: { gen: pulley, r: 29, w: 26, ribs: 0, mat: steel-zinc, pos: [470, 0, 0] }
  - id: timing-belt-tensioner
    parent: timing-drive
    kind: part
    name: Semi-automatic toothed belt tensioning roller
    explode: { dir: [1, -0.5, 0], dist: 120 }
    specs: [{ label: Lock nut, value: "20 Nm (after aligning notch and raised mark)", source: { ref: vw-diesel, locator: p. 60 } }]
    verification: { sources: [{ ref: vw-engine-mech, locator: "pp. 18–19, Part I items 8–10; p. 36" }] }
    geometry: { gen: pulley, r: 28, w: 26, ribs: 0, mat: steel-zinc, pos: [470, -80, 270] }
  - id: timing-belt-idler
    parent: timing-drive
    kind: part
    name: Toothed belt idler wheel
    explode: { dir: [1, -0.5, -0.3], dist: 120 }
    specs: [{ label: Bolt, value: "25 Nm", source: { ref: vw-engine-mech, locator: "p. 19, Part I items 13–14" } }]
    geometry: { gen: pulley, r: 23, w: 26, ribs: 0, mat: steel-zinc, pos: [470, -62, 110] }

  # ---------------------------------------------------------------- accessory drive
  - id: crank-pulley
