    verification: { sources: [{ ref: vw-engine-mech, locator: "pp. 28–29, Part III items 21–24; p. 32" }] }
    geometry: { gen: pulley, r: 34, w: 26, ribs: 0, mat: steel-zinc, pos: [505, 60, 240] }
  - id: coolant-pump
    parent: engine-assembly
    kind: part
    name: Coolant pump
    aliases: [water pump]
    summary: In the block at the timing end, driven by the ribbed belt.
    explode: { dir: [1, 0.6, 0], dist: 220 }
    contacts: [timing-belt-cover, cylinder-block]
    verification: { sources: [{ ref: vw-engine-mech, locator: "p. 22, Part I item 27; p. 29, Part III item 25" }] }
    geometry:
      gen: compound
      parts:
        - { gen: pulley, r: 52, w: 26, ribs: 6, pos: [505, 130, 150] }
        - { gen: cyl, r: 40, h: 10, axis: x, chamfer: 2, pos: [496, 130, 150], mat: aluminium-cast }

  # ---------------------------------------------------------------- injection
  - id: injection-pump
    parent: engine-assembly
    kind: assembly
    name: Injection pump (electronically controlled distributor pump)
    aliases: [diesel pump, distributor pump, fuel injection pump, VE pump]
    summary: Belt-driven distributor pump on the intake side at the timing end. The control unit meters fuel with the quantity adjuster (N146), reads its position from the modulating piston movement sender (G149) and the fuel temperature sender, times injection with the commencement of injection valve (N108) and stops the engine with the fuel shut-off valve (N109).
    location: { zone: engine-bay, text: "Front (radiator side) of the engine at the timing-belt end" }
    access:
      from: [bonnet]
      removeFirst: [timing-belt]
      notes: "Securing bolts 25 Nm; injector pipe unions 25 Nm (loosen and retighten after adjusting the timing). Fill a new pump with at least 180 ml of clean diesel through the return union. Commencement of injection is checked and set dynamically with the fault reader (function 04)."
      sources: [{ ref: vw-diesel, locator: "pp. 49–52, 59–63" }]
    explode: { dir: [0, 1, 0.2], dist: 260 }
    contacts: [cylinder-block, timing-belt-cover, timing-drive, injector-pipes]
    ewd: [N146, G149, G81]
    specs:
      - { label: Securing bolts, value: "25 Nm", source: { ref: vw-diesel, locator: p. 62 } }
      - { label: Fuel shut-off valve, value: "40 Nm", source: { ref: vw-diesel, locator: "p. 50, item 9" } }
      - { label: Delivery valve unions, value: "45 Nm", source: { ref: vw-diesel, locator: "p. 52, item 20" } }
      - { label: Banjo bolt (supply), value: "25 Nm", source: { ref: vw-diesel, locator: "p. 49, item 5" } }
    verification:
      sources: [{ ref: vw-diesel, locator: "pp. 45–52", says: "Injection pump with quantity adjuster (N146), modulating piston movement sender (G149) and fuel temperature sender" }]
  - id: injection-pump-body
    parent: injection-pump
    kind: part
    name: Injection pump body with metering control
    explode: { dir: [0, 1, 0], dist: 120 }
    geometry: { gen: machine, kind: pump, r: 52, len: 180, mat: aluminium-cast }
    placement: { pos: [318, 218, 172] }
  - id: fuel-shut-off-valve
    parent: injection-pump
    kind: part
    name: Fuel shut-off valve
    aliases: [stop solenoid, N109]
    explode: { dir: [0, 1, 1], dist: 140 }
    ewd: [N109]
    verification: { sources: [{ ref: vw-diesel, locator: "p. 48, item 20; p. 50, item 9" }] }
    geometry: { gen: cyl, r: 14, h: 36, axis: y, pos: [250, 275, 190], mat: steel-zinc }
  - id: injection-timing-valve
    parent: injection-pump
    kind: part
    name: Commencement of injection valve
    aliases: [timing solenoid, N108]
    explode: { dir: [0, 1, -1], dist: 140 }
    ewd: [N108]
    verification: { sources: [{ ref: vw-diesel, locator: "p. 52, item 24" }] }
    geometry: { gen: cyl, r: 12, h: 36, axis: y, pos: [330, 275, 140], mat: plastic-black }
  - id: injection-pump-connector
    parent: injection-pump
    kind: connector
    name: Injection pump connectors (metering control and 3-pin valve connector)
    summary: A multi-pin connector for the fuel temperature sender, quantity adjuster and modulating piston movement sender; on the AHU a separate 3-pin connector for the fuel shut-off and commencement of injection valves.
    connector: {}
    explode: { dir: [0, 1, 0.6], dist: 180 }
    placement: { pos: [200, 240, 150] }
    verification: { sources: [{ ref: vw-diesel, locator: "pp. 46–47, items 12, 19" }] }
    geometry: { gen: connector, size: [30, 40, 26], mat: connector-black }

  - id: injector-pipes
    parent: engine-assembly
    kind: pipe
    name: Injector pipes
    summary: Removed and fitted as a complete set without altering their shape (ring spanner 3035); unions 25 Nm.
    material: steel-zinc
    explode: { dir: [0, 1, 1], dist: 200 }
    specs: [{ label: Unions, value: "25 Nm", source: { ref: vw-engine-mech, locator: "p. 24, Part II item 17" } }]
    geometry:
      gen: compound
      parts:
        - { gen: tube, r: 3, points: [[410, 230, 215], [420, 200, 360], [360, 150, 372], [342, 138, 366]] }
        - { gen: tube, r: 3, points: [[410, 222, 205], [424, 190, 372], [280, 150, 378], [254, 138, 366]] }
        - { gen: tube, r: 3, points: [[410, 214, 215], [428, 182, 384], [200, 152, 384], [166, 138, 366]] }
        - { gen: tube, r: 3, points: [[410, 206, 205], [432, 174, 392], [120, 154, 390], [78, 138, 366]] }

  - id: injectors
    parent: engine-assembly
    kind: assembly
    name: Injectors (×4)
    aliases: [injector, nozzle, two-spring injector]
    summary: Two-spring injectors (injection in two stages) held in the head by a retainer; the injector of cylinder 3 carries the needle lift sender that tells the control unit the actual start of injection.
    access:
      from: [bonnet]
      notes: "Opening pressure 190–200 bar new, 170 bar wear limit; must hold 150 bar for 10 s without dripping. Retainer nut 20 Nm, injector pipes 25 Nm. A faulty injector shows as knocking, smoke or poor power: with the engine at fast idle loosen each pipe union in turn — the one that makes no difference is the faulty injector."
      sources: [{ ref: vw-diesel, locator: "pp. 65–67" }, { ref: vw-engine-mech, locator: p. 16 }]
    explode: { dir: [0, 0, 1], dist: 320 }
    contacts: [cylinder-head, cam-cover]
    verification: { sources: [{ ref: vw-diesel, locator: "p. 51, item 14; pp. 66–67", says: "Injector for 3rd cylinder with needle lift sender; this engine is equipped with dual spring injectors" }] }
  - { id: injector-1, parent: injectors, kind: part, name: Injector cylinder 1 (timing end), placement: { pos: [342, 105, 270], rot: [-20, 0, 0] }, geometry: { gen: injector, len: 105 } }
  - { id: injector-2, parent: injectors, kind: part, name: Injector cylinder 2, placement: { pos: [254, 105, 270], rot: [-20, 0, 0] }, geometry: { gen: injector, len: 105 } }
  - id: injector-3
    parent: injectors
    kind: part
    name: Injector cylinder 3 with needle lift sender
    ewd: [G80]
    placement: { pos: [166, 105, 270], rot: [-20, 0, 0] }
    verification: { sources: [{ ref: vw-diesel, locator: "p. 47, item 16; p. 51, item 14" }] }
    geometry: { gen: injector, len: 105 }
  - { id: injector-4, parent: injectors, kind: part, name: Injector cylinder 4 (gearbox end), placement: { pos: [78, 105, 270], rot: [-20, 0, 0] }, geometry: { gen: injector, len: 105 } }

  - id: glow-plugs
    parent: engine-assembly
    kind: assembly
    name: Glow plugs (×4)
    aliases: [heater plugs, glowplugs]
    summary: One per cylinder in the head, fed through the glow plug relay and the glow plug strip fuse; the control unit sets the glow period from the coolant temperature.
    access:
