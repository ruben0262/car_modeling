  - id: accessory-belt
    parent: engine-assembly
    kind: part
    name: Ribbed belt
    aliases: [auxiliary belt, serpentine belt, fan belt, poly-V belt]
    summary: Drives the coolant pump, the alternator, the power steering pump and the air conditioning compressor from the crankshaft pulley. Mark the direction of rotation before taking it off.
    access: { from: [bonnet, wheel-arch-front-right], notes: "Lift the tensioning roller with lever 3299 to slip the belt off.", sources: [{ ref: vw-engine-mech, locator: "pp. 30–33" }, { ref: ru-manual, locator: "shar_steering_rus.pdf p. 1, section 9" }] }
    explode: { dir: [1, 0, 0], dist: 360 }
    verification:
      notes: "Which units the belt drives is documented; the Sharan pulley layout is not in the documents in hand, so the routing is estimated."
      sources: [{ ref: vw-engine-mech, locator: "p. 22, Part I items 27–28; p. 33" }, { ref: ru-manual, locator: "shar_steering_rus.pdf p. 1", says: "the pump is driven by the engine through a ribbed belt" }]
    geometry:
      gen: serpentine
      x: 505
      pulleys:
        - { y: 0, z: 0, r: 76 }
        - { y: 215, z: -45, r: 56 }
        - { y: 130, z: 150, r: 52 }
        - { y: 285, z: 330, r: 30 }
        - { y: 60, z: 240, r: 34, side: -1 }
