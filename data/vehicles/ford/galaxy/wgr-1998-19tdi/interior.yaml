    geometry: { gen: pedal, len: 300, pad: [70, 64] }
  - id: brake-pedal
    parent: pedal-box
    kind: part
    name: Brake pedal with brake light switch and brake pedal switch
    aliases: [F, F47, stop light switch]
    summary: The brake light switch (F) and the brake pedal switch for the diesel control unit (F47) sit on the pedal bracket.
    explode: { dir: [-1, 0, 0], dist: 120 }
    placement: { pos: [-600, 412, 840], rot: [0, 0, 180] }
    ewd: [F, F47]
    verification: { sources: [{ ref: vw-diesel, locator: "p. 45, items 6–7; p. 68" }, { ref: ru-manual, locator: "shar_brake_rus.pdf p. 11" }] }
    geometry: { gen: pedal, len: 300, pad: [80, 64] }
  - id: accelerator-pedal
    parent: pedal-box
    kind: part
    name: Accelerator pedal with accelerator position sender
    aliases: [throttle pedal, gas pedal, G79, F60, F8]
    summary: The pedal works the accelerator position sender (with idling and kick-down switches) on a mounting pedestal through a cable cam; the sender is set with the fault reader so that the pedal reads 0 % at rest and 100 % just before full throttle (adjustment bolt 7 Nm).
    explode: { dir: [-1, 0, 0], dist: 120 }
    placement: { pos: [-590, 230, 800], rot: [0, 0, 180] }
    ewd: [G79, F60, F8]
    specs: [{ label: Adjustment bolt, value: "7 Nm; cable cam fixing 10 Nm", source: { ref: vw-diesel, locator: "pp. 56–58" } }]
    verification: { sources: [{ ref: vw-diesel, locator: "pp. 56–59", says: "Accelerator pedal position sender (G79), console, mounting pedestal, cable cam" }, { ref: vw-wd-1997, locator: "No. 14/7" }] }
    geometry: { gen: pedal, len: 260, pad: [54, 100] }

