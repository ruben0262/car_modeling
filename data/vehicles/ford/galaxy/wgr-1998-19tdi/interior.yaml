# Interior, controls and restraints, authored for LEFT-hand drive (EU). Parts marked `handed: true` are
# reflected automatically for a right-hand-drive variant.
#
# The Galaxy has a Ford-designed fascia (wikipedia-galaxy) that is not in the VW documents, so the dashboard,
# its switch positions and the radio are estimated; the components behind it and their codes come from the VW
# current flow diagrams. Switches and warning lamps without a connector of their own are mapped to the part
# they are built into (instrument cluster, switch panel, steering column).
system: interior
defaults:
  verification:
    geometry: placeholder
    placement: estimated
    facts: oem
    sources: [{ ref: vw-wd-1997, locator: "No. 3/1–3/7" }]
    notes: Interior trim is blocked out for orientation only.

nodes:
  - id: dashboard
    kind: part
    name: Dash panel (Ford fascia)
    aliases: [dash, fascia, instrument panel, dashboard]
    summary: Ford-designed fascia with the instrument cluster in front of the driver, the centre stack with heater controls and radio, and the glove box; the air ducts are moulded into it.
    location: { zone: cabin-dashboard, text: "Across the front of the cabin" }
    explode: { dir: [0.4, 0, 1], dist: 260 }
    material: interior-dark
    contacts: [engine-control-unit, immobilizer-control-unit, plenum-panel]
    verification:
      notes: "Ford styling; the outline is estimated around the windscreen and the dash cross member."
      sources: [{ ref: wikipedia-galaxy, says: "Ford-designed fascia" }, { ref: ssp-169, locator: p. 60, says: "Die Luftführungskanäle zwischen Heizungsgerät und Ausströmer sind in der Schalttafel integriert" }]
    geometry:
      gen: prism
      plane: xz
      thickness: 1300
      bevel: 18
      outline: [[-140, 1110], [-170, 1160], [-500, 1235], [-800, 1245], [-965, 1190], [-1010, 1090], [-975, 1000], [-900, 960], [-840, 1015], [-780, 1060], [-500, 1075], [-300, 1065], [-170, 1050]]

  - id: instrument-cluster
    kind: part
    name: Dash panel insert (instrument cluster)
    aliases: [dials, speedometer, clocks, instrument cluster, J285]
    summary: Electronic dash panel insert with its control unit on the circuit board; diagnosed only through the self-diagnosis connector. It carries the speedometer, rev counter, coolant temperature and fuel gauges, the odometer display, the multi-function display, the warning lamps and the oil pressure buzzer.
    location: { zone: cabin-dashboard, text: "Behind the steering wheel (left on LHD)" }
    access: { from: [cabin-front], notes: "The engine and immobilizer control units sit behind it." }
    handed: true
    explode: { dir: [-0.4, 0, 1], dist: 320 }
    contacts: [dashboard]
    placement: { pos: [-955, 360, 1115], rot: [0, -20, 0] }
    ewd: [J285, J119, G1, G3, G5, G21, Y4, H11, L10, L95, K1, K2, K3, K4, K7, K18, K28, K29, K47, K65, K75, K94, K105, K106, K123, K124, K125, K126, K127]
    verification:
      sources: [{ ref: ssp-169, locator: p. 45, says: "Elektronisch gesteuerter Schalttafeleinsatz; das Steuergerät ist in der Platine integriert; Diagnose ausschließlich über den Diagnoseanschluß" }, { ref: vw-wd-1997, locator: "No. 3/1–3/7" }]
    geometry:
      gen: compound
      parts:
        - { gen: box, size: [70, 330, 130], r: 16, mat: interior-trim }
        - { gen: box, size: [6, 300, 104], r: 10, pos: [-36, 0, 0], mat: glass }

  - id: steering-wheel
    kind: assembly
    name: Steering wheel with driver airbag and horn plate
    aliases: [wheel, steering]
    location: { zone: cabin-front, text: "Driver's side (left on LHD)" }
    access:
      from: [cabin-front]
      notes: "Disconnect the battery earth strap first; on refitting switch the ignition on before reconnecting it. Airbag unit bolts (internal splines) 8 Nm; steering wheel nut 50 Nm (renew the self-locking nut). The steering wheel must be centred with the wheels straight ahead."
      sources: [{ ref: ru-manual, locator: "shar_steering_rus.pdf p. 3, fig. 10.22, steps 12–28" }]
    handed: true
    explode: { dir: [-1, 0, 0.5], dist: 360 }
    placement: { pos: [-1150, 360, 1000], rot: [0, 25, 0] }
    verification: { sources: [{ ref: ru-manual, locator: "shar_steering_rus.pdf p. 3" }, { ref: vw-wd-1997, locator: "No. 19/2, No. 62/2" }] }
  - { id: steering-wheel-rim, parent: steering-wheel, kind: part, name: Steering wheel, explode: { dir: [-1, 0, 0], dist: 120 }, geometry: { gen: steering-wheel, r: 190, grip: 16 } }
  - id: driver-airbag
    parent: steering-wheel
    kind: part
    name: Driver airbag unit
    aliases: [airbag, N95]
    explode: { dir: [-1, 0, 0], dist: 220 }
    ewd: [N95]
    verification: { sources: [{ ref: vw-wd-1997, locator: "No. 19/2", says: "N95 Airbag igniter, driver's side" }] }
    geometry: { gen: box, size: [40, 150, 120], r: 24, pos: [-24, 0, 0], mat: interior-dark }
  - id: horn-plate
    parent: steering-wheel
    kind: part
    name: Horn plate
    aliases: [horn button, H]
    explode: { dir: [-1, 0, 0.3], dist: 180 }
    ewd: [H]
    verification: { sources: [{ ref: vw-wd-1997, locator: "No. 62/2", says: "H Horn plate" }] }
    geometry: { gen: box, size: [8, 160, 40], r: 4, pos: [-8, 0, -70], mat: interior-trim }

  - id: steering-column
    kind: part
    name: Steering column with switches, ignition lock and airbag coil connector
    aliases: [column, stalks, indicator stalk, wiper stalk, ignition switch]
    summary: Height- and reach-adjustable safety column with two universal joints. It carries the turn signal / dipper-flasher stalk and the wiper stalk (with the multi-function display button), the cruise control switch where fitted, the ignition/starter switch with the immobilizer reading coil, and the airbag coil connector under the wheel.
    handed: true
    explode: { dir: [-1, 0, 0.6], dist: 300 }
    material: steel-black
    contacts: [dashboard, steering-intermediate-shaft, bulkhead, instrument-cluster, steering-wheel, dash-crossbeam]
    ewd: [E2, E4, E22, E86, E45, D, D2, F138]
    verification:
      sources: [{ ref: ssp-169, locator: p. 28, says: "Höhen- und längsverstellbare Sicherheits-Lenksäule mit zwei Kreuzgelenken" }, { ref: vw-wd-1997, locator: "No. 1/3, 4/5–4/6, 8/4, 19/2, 63/3, 3/4, 14/8" }]
    geometry:
      gen: compound
      parts:
        - { gen: tube, r: 30, points: [[-1125, 360, 988], [-900, 360, 885], [-700, 360, 790], [-482, 360, 666]] }
        - { gen: box, size: [140, 150, 110], r: 20, pos: [-1050, 360, 950], mat: interior-dark }

