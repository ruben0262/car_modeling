      sources:
        - { ref: ssp-169, locator: p. 37 }
        - { ref: vw-wd-1997, locator: "No. 20/3" }
        - { ref: ru-manual, locator: "shar_brake_rus.pdf p. 1, fault codes" }
    geometry: { gen: wheel-speed-sensor, len: 44 }
  - id: rear-wss-cable
    parent: rear-brake
    kind: harness
    name: Rear wheel speed sensor cable
    material: harness-black
    harness: { connects: [rear-wheel-speed-sensor, rear-wss-connector] }
    explode: { dir: [0.5, 0, 1], dist: 100 }
    verification: { placement: estimated }
    geometry: { gen: tube, r: 3, points: [[-40, -62, 90], [40, -120, 110], [180, -220, 90], [285, -292, 64]] }
  - id: rear-wss-connector
    parent: rear-brake
    kind: connector
    name: Rear wheel speed sensor connector
    summary: Two-pin connector on the cross member (the diagram places the rear right one near the silencer and the rear left one near the fuel tank).
    connector: { pins: 2 }
    placement: { pos: [300, -300, 60], rot: [0, 0, 90] }
    explode: { dir: [0, 0, 1], dist: 120 }
    verification:
      placement: estimated
      sources: [{ ref: vw-wd-1997, locator: "No. 20/3", says: "T2b 2-pin connector, on cross member near silencer (G44); T2c 2-pin connector, on cross member near fuel tank (G46)" }]
    geometry: { gen: connector, size: [30, 22, 18], mat: connector-black, wireR: 3 }

  # ---------------------------------------------------------------- parking brake actuation
  - id: parking-brake-cables
    kind: assembly
    name: Parking brake cables and equaliser
    summary: One cable from the lever to an equaliser bar under the floor, then one cable to the lever on each rear caliper; the rear cables run back beside the tunnel, inboard of the fuel tank, and turn out behind it. The travel is adjusted with the nut at the equaliser.
    location: { zone: underbody-centre, text: "Under the floor below the handbrake lever, then back to the rear wheels" }
    access:
      from: [underside]
      notes: "Adjust only after renewing cables, calipers, pads or discs: raise the rear, release the handbrake, tighten the adjusting nut at the equaliser until both caliper levers just lift off their stops (no more than 1 mm), apply and release the handbrake, and check both wheels turn freely."
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf p. 9, section 7" }]
    explode: { dir: [0, 0, -1], dist: 160 }
    verification:
      placement: estimated
      sources: [{ ref: ssp-169, locator: p. 34, says: "Der Handbremshebelweg kann am Ausgleichbügel des Handbremsseils eingestellt bzw. korrigiert werden" }, { ref: ru-manual, locator: "shar_brake_rus.pdf p. 8, fig. 7.0" }]
  - { id: parking-brake-cable-front, parent: parking-brake-cables, kind: harness, name: Parking brake front cable (lever to equaliser), material: steel-zinc, geometry: { gen: tube, r: 3, points: [[-1290, 0, 470], [-1320, 0, 330], [-1380, 0, 282]] } }
  - id: parking-brake-equaliser
    parent: parking-brake-cables
    kind: part
    name: Parking brake equaliser and adjusting nut
    aliases: [handbrake compensator, Ausgleichbügel]
    material: steel-zinc
    geometry:
