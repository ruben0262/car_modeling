  - id: abs-unit
    kind: assembly
    name: ABS unit (ITT Teves 04 GI)
    aliases: [ABS pump, ABS modulator, hydraulic unit, ABS module]
    summary: "Compact unit of hydraulic pump, valve block and control unit J104. Four control channels with diagonal split: one valve pair (inlet and outlet) for each front wheel, and two valve pairs controlling both rear wheels together (select-low). The software also does the electronic brake-force distribution that replaces the rear pressure regulator; with EDS the valve block has two more valves and is slightly larger."
    location: { zone: engine-bay-left, text: "Left of the master cylinder, on brackets to the longitudinal member and the battery console" }
    access:
      from: [bonnet]
      notes: "Before welding, unplug the control unit (ignition off). For paint drying the unit may see 95 °C briefly or 85 °C for up to 2 hours."
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf p. 4, ABS notes" }]
    placement: { pos: [-250, 590, 760] }
    explode: { dir: [0.4, 0.5, 1], dist: 300 }
    verification:
      placement: estimated
      sources:
