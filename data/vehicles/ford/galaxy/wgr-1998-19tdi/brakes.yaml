  # ---------------------------------------------------------------- hydraulics (LHD)
  - id: brake-servo
    kind: part
    name: Brake servo (10 in)
    aliases: [brake booster, servo, vacuum booster, Bremskraftverstärker]
    summary: Vacuum servo on the bulkhead, driver's side, with the tandem master cylinder bolted to its front. On the diesel the vacuum comes from the engine's vacuum pump.
    location: { zone: engine-bay-rear, text: "On the bulkhead, driver's side (left on LHD)" }
    access:
      from: [bonnet]
      notes: "Check: with the engine off press the pedal at least 5 times, hold it and start the engine; the pedal must sink noticeably. If not, check the vacuum hose and, on the diesel, pull the hose off the vacuum pump and check for suction at its connection."
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf pp. 10–11, section 11" }]
    handed: true
    explode: { dir: [0.4, 0, 1], dist: 220 }
    material: steel-black
    contacts: [bulkhead]
    specs: [{ label: Size, value: "10 in", source: { ref: ssp-169, locator: p. 32 } }]
    verification:
      placement: estimated
      sources: [{ ref: ssp-169, locator: "pp. 32, 35", says: "Diagonal geteiltes Zweikreis-Bremssystem mit einem 10\"-Bremskraftverstärker" }]
    geometry: { gen: cyl, r: 127, h: 150, axis: x, chamfer: 22, pos: [-390, 380, 800] }

  - id: master-cylinder
    kind: part
    name: Brake master cylinder (tandem)
    location: { zone: engine-bay-rear, text: "Bolted to the front of the brake servo" }
    access: { from: [bonnet] }
    handed: true
    explode: { dir: [1, 0, 1], dist: 240 }
    material: aluminium-cast
    contacts: [brake-servo]
    summary: Tandem master cylinder for the two diagonal circuits (front right + rear left, front left + rear right); its two outlets feed the ABS hydraulic unit.
    verification:
      placement: estimated
      sources: [{ ref: ssp-169, locator: "pp. 32, 35" }, { ref: ru-manual, locator: "shar_brake_rus.pdf p. 2, section 1; p. 3, fig. 1.0b" }]
    geometry:
      gen: compound
      parts:
        - { gen: cyl, r: 22, h: 170, axis: x, chamfer: 3, pos: [-228, 380, 800] }
        - { gen: box, size: [20, 100, 70], r: 6, pos: [-305, 380, 800] }

  - id: brake-fluid-reservoir
    kind: part
    name: Brake fluid reservoir with level warning contact
    aliases: [brake fluid tank, compensating reservoir]
    summary: Translucent reservoir on the master cylinder. The level warning contact in it lights the brake warning lamp K118 when the level is low (the same lamp shows the applied handbrake).
    location: { zone: engine-bay-rear, text: "On top of the master cylinder" }
    access:
      from: [bonnet]
      notes: "Fluid DOT 4 (FMVSS 116; Ford spec SAM 6C9103A), about 2.0 L in the system; renew every 2 years. Fluid is poisonous and attacks paint. Bleeding order: rear right, rear left, front right, front left; with ABS a filler unit must not exceed 1 bar, and a system whose reservoir ran dry must be bled in a workshop with the diagnostic tester."
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf p. 1; pp. 9–10, sections 8–9" }]
    handed: true
    explode: { dir: [0, 0, 1], dist: 300 }
    contacts: [master-cylinder]
    ewd: [F34]
    verification:
      placement: estimated
      sources: [{ ref: ssp-169, locator: p. 32, says: "Kontrollampe für Bremsanlage K118 (für angezogene Handbremse und zu niedrigen Bremsflüssigkeitsstand)" }, { ref: vw-wd-1997, locator: "F34 Brake fluid level warning contact" }]
    geometry:
      gen: compound
      parts:
        - { gen: box, size: [120, 90, 66], r: 10, pos: [-218, 380, 866], mat: plastic-white }
        - { gen: cyl, r: 26, h: 18, axis: z, chamfer: 3, pos: [-195, 380, 908], mat: plastic-black }

