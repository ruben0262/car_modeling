# Brakes. Shared with the VW Sharan: diagonally split dual-circuit system with a 10" servo, ventilated
# front discs and solid rear discs with single-piston floating calipers, the parking brake built into the
# rear calipers (self-adjusting, cable-operated), and the ITT Teves ABS 04 GI with an integrated control
# unit (ssp-169 pp. 32–38). ABS was standard on the Galaxy 1.9 TDI (adac-galaxy-19tdi), so the
# deceleration-dependent brake pressure regulator of the non-ABS cars (ssp-169 p. 34) is not fitted.
#
# Corner assemblies use the wheel-centre frame (+Y outboard); the hub mounting face is at +55 mm (wheel
# offset ET 55). Servo, master cylinder and ABS unit are authored for left-hand drive. Torques and limits
# are from the workshop book (ru-manual, shar_brake_rus.pdf), which covers 1995–2000 cars: the values
# below are those for the Teves/ATE front brakes fitted up to 05.2000 and for 15" wheels.
system: brakes
defaults:
  verification:
    geometry: schematic
    placement: referenced
    facts: oem
    sources: [{ ref: ssp-169, locator: "pp. 32–38" }]

nodes:
  # ---------------------------------------------------------------- front corners
  - id: front-brake
    kind: assembly
    sides: [left, right]
    name: Front brake
    location: { zone: wheel-arch-front-left, text: "Inside the front wheel" }
    access: { from: [wheel-arch-front-left], removeFirst: [wheel-front] }
    placement: { pos: [0, 765, 317.25] }
    explode: { dir: [0, 1, 0], dist: 440 }
    verification: { sources: [{ ref: ssp-169, locator: p. 33 }, { ref: ru-manual, locator: "shar_brake_rus.pdf p. 3, fig. 1.0d" }] }

  - id: front-brake-disc
    parent: front-brake
    kind: part
    name: Front brake disc (ventilated, 288 mm)
    aliases: [brake rotor, disc, front disc]
    summary: Internally ventilated disc held to the hub by one hex-socket screw (10 Nm) and the wheel bolts. Renew both discs of an axle together.
    access:
      from: [wheel-arch-front-left]
      removeFirst: [wheel-front, front-caliper]
      notes: "Mark the wheel's position on the hub first. Undo the 2 carrier bolts and hang the caliper on wire (not on the hose), remove the screw and the disc; free a seized disc with rust remover, never by hammering on it. On refitting: new discs cleaned of their protective coating, screw 10 Nm, carrier bolts 200 Nm."
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf pp. 8–9, section 6" }]
    contacts: [wheel-front]
    explode: { dir: [0, 1, 0], dist: 120 }
    specs:
      - { label: Size, value: "288 mm × 25 mm, internally ventilated", source: { ref: ssp-169, locator: p. 33 } }
      - { label: Wear limit, value: "21.0 mm minimum thickness (Teves/ATE brakes up to 05.2000)", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 1" } }
      - { label: Run-out, value: "0.05 mm maximum; thickness variation 0.01 mm maximum (workshop check)", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 9, step 11" } }
      - { label: Retaining screw, value: "Hex socket, 10 Nm", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 3, fig. 1.0d item 1" } }
    verification:
      geometry: representative
      notes: "Diameter and thickness match the specification; the vane pattern and hat depth are approximations."
      sources: [{ ref: ssp-169, locator: p. 33, says: "An der Vorderradbremse kommen innenbelüftete Bremsscheiben zum Einsatz. Scheibendurchmesser 288 mm, Scheibendicke 25 mm" }]
    geometry: { gen: brake-disc, d: 288, t: 25, y: 12.5, vented: true, hatDepth: 30, hatR: 76, ring: 55, pcd: 112 }

  - id: front-dust-shield
    parent: front-brake
    kind: part
    name: Front brake splash plate
    aliases: [dust shield, backing plate]
    explode: { dir: [0, -1, 0], dist: 90 }
    contacts: [front-caliper, front-wheel-speed-sensor]
    material: steel-zinc
    verification: { sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf p. 3, fig. 1.0d items 5–6" }] }
    geometry: { gen: lathe, axis: y, profile: [[64, -34], [146, -34], [150, -28], [146, -26], [64, -30]] }

  - id: front-caliper
    parent: front-brake
    kind: assembly
    detail: true
    name: Front brake caliper (Teves/ATE, single piston, floating)
    aliases: [caliper, brake caliper, FN3]
    summary: Floating caliper sliding on two guide pins in the carrier, which is bolted to the wheel bearing housing with 2 bolts; one piston. The inner pad clips into the piston with its spreader spring, the outer pad sits in the carrier, and a retaining spring is fitted into both holes of the caliper.
    access:
      from: [wheel-arch-front-left]
      removeFirst: [wheel-front]
      tools: [Torx/hex key for the guide pins, piston resetting tool]
      notes: "Pads: pull the caliper outwards to push the piston back a little, prise off the upper and lower caps, lever out the retaining spring, unplug the pad wear sensor if fitted, unscrew both guide pins and hang the caliper on wire. Pushing the piston back sends fluid to the reservoir, so watch the level. Guide pins 25 Nm; outer pads carry an adhesive film to peel off. Renew all pads of an axle together and pump the pedal hard several times before driving."
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf pp. 5–6, section 2" }]
    contacts: [front-brake-disc]
    explode: { dir: [-1, 0.6, 0], dist: 160 }
    specs:
      - { label: Carrier to wheel bearing housing, value: "2 bolts, 200 Nm", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 2; p. 3, fig. 1.0d item 17" } }
      - { label: Guide pins (caliper to carrier), value: "25 Nm", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 2; p. 3, fig. 1.0d item 12" } }
      - { label: Pads, value: "19.0 mm new including backing plate; renew at 2.0 mm lining", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 1" } }
    verification:
      placement: estimated
      notes: "The caliper sits behind the wheel centre (ssp-169 fig. 169/36); its exact clock position is estimated."
      sources: [{ ref: ssp-169, locator: p. 33, says: "Einkolben-Bremssättel" }, { ref: ru-manual, locator: "shar_brake_rus.pdf p. 3, fig. 1.0d" }]
  - { id: front-caliper-housing, parent: front-caliper, kind: part, name: Floating caliper housing, explode: { dir: [-1, -0.3, 0], dist: 90 }, geometry: { gen: caliper, part: housing, d: 288, t: 25, y: 12.5, at: 150, span: 60, piston: 54, reach: 17 } }
  - { id: front-caliper-carrier, parent: front-caliper, kind: part, name: Brake carrier, aliases: [caliper bracket, anchor], explode: { dir: [-1, -1, 0], dist: 60 }, geometry: { gen: caliper, part: carrier, d: 288, t: 25, y: 12.5, at: 150, span: 60, piston: 54, reach: 17 } }
  - { id: front-pad-inner, parent: front-caliper, kind: part, name: Inner brake pad with spreader spring, aliases: [brake pad], explode: { dir: [0, -1, 0], dist: 70 }, geometry: { gen: caliper, part: pad-inner, d: 288, t: 25, y: 12.5, at: 150, span: 60, piston: 54, reach: 17 } }
  - { id: front-pad-outer, parent: front-caliper, kind: part, name: Outer brake pad, aliases: [brake pad], explode: { dir: [0, 1, 0], dist: 70 }, geometry: { gen: caliper, part: pad-outer, d: 288, t: 25, y: 12.5, at: 150, span: 60, piston: 54, reach: 17 } }
  - { id: front-caliper-piston, parent: front-caliper, kind: part, name: Caliper piston and seal, explode: { dir: [0, -1, 0], dist: 150 }, geometry: { gen: caliper, part: piston, d: 288, t: 25, y: 12.5, at: 150, span: 60, piston: 54, reach: 17 } }
  - { id: front-bleed-nipple, parent: front-caliper, kind: part, name: Bleed valve, aliases: [bleed nipple, bleeder, bleed screw], explode: { dir: [-0.3, 0, 1], dist: 90 }, geometry: { gen: caliper, part: bleed-nipple, d: 288, t: 25, y: 12.5, at: 150, span: 60, piston: 54, reach: 17 } }
  - { id: front-slide-pins, parent: front-caliper, kind: part, name: Guide pins with sleeves and caps, aliases: [slide pins, caliper pins, guide bushes], explode: { dir: [-1, 0, 0], dist: 120 }, geometry: { gen: caliper, part: slide-pins, d: 288, t: 25, y: 12.5, at: 150, span: 60, piston: 54, reach: 17 } }

  - id: front-brake-hose
    parent: front-brake
    kind: hose
    name: Front flexible brake hose
    summary: Joins the rigid pipe to the caliper; it must hang without twist and must not touch anything over full lock and suspension travel.
    material: rubber
    explode: { dir: [-1, 0, 1], dist: 120 }
    specs:
      - { label: Hose to caliper, value: "25 Nm in the book's torque table; 15 Nm at both ends in its hose-renewal procedure", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 2; p. 10, section 10 step 5" } }
    verification:
      placement: estimated
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf p. 10, section 10" }]
    geometry: { gen: tube, r: 5, points: [[-112, -70, 62], [-120, -110, 160], [-95, -130, 260], [-80, -125, 300]] }

  - id: front-wheel-speed-sensor
    parent: front-brake
    kind: part
    name: Front ABS wheel speed sensor
    aliases: [ABS sensor, wheel speed sensor, speed sensor, Drehzahlfühler]
    function: Inductive sensor facing the toothed rotor on the outer constant-velocity joint; its alternating-voltage signal gives the wheel speed for ABS, EDS and the electronic brake-force distribution.
    summary: Fitted in a bore in the wheel bearing housing and held by a hex-socket bolt (10 Nm). The gap to the rotor is fixed by the fitting position, so there is nothing to adjust.
    access:
      from: [wheel-arch-front-left]
      removeFirst: [wheel-front]
      notes: "Before fitting, clean the bore and coat it with grease (VW G 000 650). Bolt 10 Nm."
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf p. 3, fig. 1.0d items 7–9" }]
    placement: { pos: [-10, -80, 76], rot: [90, 0, 0] }
    explode: { dir: [0, 0, 1], dist: 140 }
    ewd: [G47:l, G45:r]
    faults:
      - { symptom: "ABS warning lamp K47 on; fault 00283 (front left sensor G47) or 00285 (front right sensor G45)", cause: "Open circuit, damaged sensor or too large a gap to the rotor (dirt or rust under the sensor, damaged rotor)." }
    verification:
      sources:
        - { ref: ssp-169, locator: p. 37, says: "Die Drehzahlfühler sind jeweils in den vorderen Radlagergehäusen bzw. hinteren Achslenkern eingebaut. Der Abstand zum Impulsrad ist durch die Einbaulage der Sensoren vorgegeben" }
        - { ref: vw-wd-1997, locator: "No. 20/3" }
        - { ref: ru-manual, locator: "shar_brake_rus.pdf p. 1, fault codes" }
    geometry: { gen: wheel-speed-sensor, len: 44 }
  - id: front-wss-cable
    parent: front-brake
    kind: harness
    name: Front wheel speed sensor cable
    material: harness-black
    harness: { connects: [front-wheel-speed-sensor, front-wss-connector] }
    explode: { dir: [0.5, 0, 1], dist: 100 }
    verification: { placement: estimated }
    geometry: { gen: tube, r: 3, points: [[-10, -80, 102], [-40, -108, 180], [-70, -110, 255], [-86, -104, 290]] }
  - id: front-wss-connector
    parent: front-brake
    kind: connector
    name: Front wheel speed sensor connector
    summary: Two-pin connector joining the sensor lead to the body harness at the suspension strut.
    connector: { pins: 2 }
    placement: { pos: [-90, -102, 300], rot: [0, 0, 90] }
    explode: { dir: [0, 0, 1], dist: 120 }
    verification:
      placement: estimated
      notes: "The diagram legend places the 2-pin connectors T2 and T2a at the left and right suspension strut, but its drawing joins T2 to the front right sensor G45 and T2a to the front left sensor G47; the side is open."
      sources: [{ ref: vw-wd-1997, locator: "No. 20/3", says: "T2 2-pin connector, rear suspension strut, left; T2a 2-pin connector, rear suspension strut, right" }]
    geometry: { gen: connector, size: [30, 22, 18], mat: connector-black, wireR: 3 }

  # ---------------------------------------------------------------- rear corners
  - id: rear-brake
    kind: assembly
    sides: [left, right]
    name: Rear brake and parking brake
    location: { zone: wheel-arch-rear-left, text: "Inside the rear wheel" }
    access: { from: [wheel-arch-rear-left], removeFirst: [wheel-rear] }
    placement: { pos: [-2835, 762, 317.25] }
    explode: { dir: [0, 1, 0], dist: 440 }
    verification: { sources: [{ ref: ssp-169, locator: "pp. 33–34" }, { ref: ru-manual, locator: "shar_brake_rus.pdf p. 4, fig. 1.0e" }] }

  - id: rear-brake-disc
    parent: rear-brake
    kind: part
    name: Rear brake disc (solid, 268 mm)
    aliases: [rear rotor, rear disc]
    summary: Solid disc held by one hex-socket screw (10 Nm) and the wheel bolts. Renew both discs of an axle together.
    access:
      from: [wheel-arch-rear-left]
      removeFirst: [wheel-rear, rear-caliper]
      notes: "Unhook the parking brake cable, undo the 2 carrier bolts (110 Nm on refitting) and hang the caliper on wire; remove the screw and the disc. Afterwards adjust the parking brake."
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf pp. 8–9, section 6" }]
    contacts: [wheel-rear]
    explode: { dir: [0, 1, 0], dist: 120 }
    specs:
      - { label: Size, value: "268 mm × 10 mm, solid (15\" wheels)", source: { ref: ssp-169, locator: p. 33 } }
      - { label: Wear limit, value: "8.0 mm minimum thickness", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 1" } }
      - { label: Retaining screw, value: "Hex socket, 10 Nm", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 4, fig. 1.0e item 2" } }
    verification:
      geometry: representative
      notes: "Diameter and thickness match the specification; the hat depth is approximate."
      sources: [{ ref: ssp-169, locator: p. 33, says: "An der Hinterradbremse kommen Massivscheiben zum Einsatz. Scheibendurchmesser 268 mm, Scheibendicke 10 mm" }]
    geometry: { gen: brake-disc, d: 268, t: 10, y: 16, vented: false, hatDepth: 34, hatR: 72, ring: 45, pcd: 112 }

  - id: rear-dust-shield
    parent: rear-brake
    kind: part
    name: Rear brake splash plate
    explode: { dir: [0, -1, 0], dist: 90 }
    contacts: [rear-caliper, rear-wheel-speed-sensor]
    material: steel-zinc
    specs: [{ label: Bolts, value: "10 Nm", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 4, fig. 1.0e items 9–10" } }]
    verification: { sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf p. 4, fig. 1.0e" }] }
    geometry: { gen: lathe, axis: y, profile: [[60, -16], [136, -16], [140, -10], [136, -8], [60, -12]] }

  - id: rear-caliper
    parent: rear-brake
    kind: assembly
    detail: true
    name: Rear brake caliper with integrated parking brake
    aliases: [rear caliper, handbrake caliper]
    summary: Single-piston floating caliper on two guide pins, carrier bolted to the trailing arm. The parking brake is built into the caliper and adjusts itself; the cable pulls a lever on the back of the caliper.
    access:
      from: [wheel-arch-rear-left]
      removeFirst: [wheel-rear]
      tools: [Piston resetting tool VW 3272 or Ford 12-006, 13 mm open-ended spanner]
      notes: "Pads: release the parking brake and unhook the cable from the caliper, undo the 2 caliper bolts while holding the guide pins, hang the caliper on wire. The piston must be screwed back clockwise with the resetting tool (turned on its 13 mm flats); never press it back, or the automatic adjuster is ruined. Fit new self-locking caliper bolts (35 Nm), then adjust the parking brake."
      sources: [{ ref: ru-manual, locator: "shar_brake_rus.pdf pp. 6–7, section 3" }]
    contacts: [rear-brake-disc]
    explode: { dir: [-1, 0.6, 0], dist: 160 }
    specs:
      - { label: Carrier to trailing arm, value: "2 bolts, 110 Nm", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 2; p. 4, fig. 1.0e item 15" } }
      - { label: Caliper bolts, value: "35 Nm, self-locking: renew (4 are in the pad repair kit); hold the guide pin while turning", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 4, fig. 1.0e item 16; p. 7, step 11" } }
      - { label: Pads, value: "17.0 mm new including backing plate; renew at 2.0 mm lining", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 1" } }
    verification:
      placement: estimated
      notes: "The caliper sits ahead of the wheel centre, above it (ssp-169 fig. 169/37); its exact clock position is estimated."
      sources: [{ ref: ssp-169, locator: p. 33, says: "Im Bremssattel integrierte Feststellbremse mit automatischer Nachstellung" }, { ref: ru-manual, locator: "shar_brake_rus.pdf p. 4, fig. 1.0e" }]
  - { id: rear-caliper-housing, parent: rear-caliper, kind: part, name: Floating caliper housing with handbrake mechanism, explode: { dir: [-1, -0.3, 0], dist: 90 }, geometry: { gen: caliper, part: housing, d: 268, t: 10, y: 16, at: 40, span: 56, piston: 38, reach: 26 } }
  - { id: rear-caliper-carrier, parent: rear-caliper, kind: part, name: Brake carrier, explode: { dir: [-1, -1, 0], dist: 60 }, geometry: { gen: caliper, part: carrier, d: 268, t: 10, y: 16, at: 40, span: 56, piston: 38, reach: 26 } }
  - { id: rear-pad-inner, parent: rear-caliper, kind: part, name: Inner brake pad, aliases: [brake pad], explode: { dir: [0, -1, 0], dist: 70 }, geometry: { gen: caliper, part: pad-inner, d: 268, t: 10, y: 16, at: 40, span: 56, piston: 38, reach: 26 } }
  - { id: rear-pad-outer, parent: rear-caliper, kind: part, name: Outer brake pad, aliases: [brake pad], explode: { dir: [0, 1, 0], dist: 70 }, geometry: { gen: caliper, part: pad-outer, d: 268, t: 10, y: 16, at: 40, span: 56, piston: 38, reach: 26 } }
  - { id: rear-caliper-piston, parent: rear-caliper, kind: part, name: Caliper piston with automatic adjuster, explode: { dir: [0, -1, 0], dist: 140 }, geometry: { gen: caliper, part: piston, d: 268, t: 10, y: 16, at: 40, span: 56, piston: 38, reach: 26 } }
  - { id: rear-bleed-nipple, parent: rear-caliper, kind: part, name: Bleed valve, aliases: [bleed nipple, bleed screw], explode: { dir: [-0.3, 0, 1], dist: 90 }, geometry: { gen: caliper, part: bleed-nipple, d: 268, t: 10, y: 16, at: 40, span: 56, piston: 38, reach: 26 } }
  - { id: rear-slide-pins, parent: rear-caliper, kind: part, name: Guide pins and protective caps, aliases: [slide pins, guide pins], explode: { dir: [-1, 0, 0], dist: 120 }, geometry: { gen: caliper, part: slide-pins, d: 268, t: 10, y: 16, at: 40, span: 56, piston: 38, reach: 26 } }
  - id: rear-handbrake-lever
    parent: rear-caliper
    kind: part
    name: Parking brake lever on the caliper
    aliases: [caliper handbrake lever]
    summary: The cable end hooks into this lever. Correctly adjusted, the lever lifts off its stop by no more than 1 mm.
    explode: { dir: [0, -1, 0.4], dist: 110 }
    material: steel-zinc
    verification: { sources: [{ ref: ssp-169, locator: p. 33, says: "Hebel – Feststellbremse" }, { ref: ru-manual, locator: "shar_brake_rus.pdf p. 9, fig. 7.4" }] }
    geometry: { gen: box, size: [66, 10, 20], r: 3, pos: [100, -72, 52], rot: [0, -40, 0] }

  - id: rear-brake-hose
    parent: rear-brake
    kind: hose
    name: Rear flexible brake hose
    material: rubber
    explode: { dir: [-1, 0, 1], dist: 120 }
    specs: [{ label: Hose to caliper, value: "25 Nm in the torque table; 15 Nm at both ends in the hose-renewal procedure", source: { ref: ru-manual, locator: "shar_brake_rus.pdf p. 2; p. 10, section 10 step 5" } }]
    verification: { placement: estimated }
    geometry: { gen: tube, r: 5, points: [[120, -50, 70], [170, -110, 110], [230, -170, 120], [280, -200, 110]] }

  - id: rear-wheel-speed-sensor
