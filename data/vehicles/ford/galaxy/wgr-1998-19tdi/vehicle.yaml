# Netlists extracted from the VW Sharan current flow diagrams with tools/ewd/import-vw.ts. VW draws one diagram per
# engine and item of equipment and dates each one ("from January 1998"), so a set is chosen by build date: the
# 1.9 TDI AHU engine, manual gearbox, air conditioner and the body equipment diagrams. VW T-connector codes are
# per diagram: where two diagrams use the same code for different connectors the id carries the diagram number
# ("T2.20" = T2 of diagram No. 20). The Galaxy-specific Ford radio is not in these diagrams.
wiring:
  id: vw-1998-jan
  file: wiring/vw-sharan-1998-jan.json
  source: vw-wd-1997
  label: Built January–April 1998
  years: "1998"
  note: >-
    VW Sharan diagrams (issue of September 1997) for a car built between January and April 1998: Nos. 1–5, 7, 8, 14
    (1.9 TDI AHU from 09.1997), 19–24, 37, 39, 40, 47, 55, 56, 62 and 63 (from 01.1998), 74 (air conditioner AHU from
    01.1998) and 80. Optional equipment (sunroof, seat heating, trailer socket, auxiliary heater, headlamp washers,
    heated windscreen, rear vent wings, 2nd heat exchanger) is included and marked as fitment on its parts. Wires
    without a printed far end continue on a sheet that is not part of this set.
  publications:
    - { id: vw-1998-sep, file: wiring/vw-sharan-1998-sep.json, source: vw-wd-1997, label: Built September–December 1997, years: "1998", note: "Dual tone horn No. 6, immobilizer No. 9 with relay J447, air conditioner No. 32 and 2nd heat exchanger No. 18 (all from 09.1997)." }
    - { id: vw-1998-may, file: wiring/vw-sharan-1998-may.json, source: vw-wd-1997, label: Built May–August 1998, years: "1998", note: "Engine No. 85, airbag No. 86 and exterior mirrors No. 88 from 05.1998." }
    - { id: vw-1999-nov, file: wiring/vw-sharan-1999-nov.json, source: vw-wd-1997, label: Built from November 1998, years: "1999", note: "Adds heated windows No. 97 (09.1998), wash/wipe No. 90, immobilizer No. 98 and 12 V socket No. 96 (11.1998)." }
    - { id: vw-1997-my, file: wiring/vw-sharan-1997-my.json, source: vw-wd-1995, label: "1997 model year (from September 1996)", years: "1997", note: "1995 issue: basic equipment No. 42 (from 09.1996), 1Z/AHU engine No. 10, air conditioning No. 11 and the equipment diagrams. Fewer far ends were found in this older issue (88 % of wires)." }
  notApplicable:
    - codes: [J217, J226]
      reason: Automatic gearbox only (gearbox control unit; starter inhibitor and reversing light relay, drawn dashed "Only models with automatic gearbox"); this car has the 5-speed manual gearbox.
      source: { ref: vw-wd-1997, locator: "No. 1/2, No. 2/3" }
    - codes: [J220, J361]
      reason: Petrol engine control units (2.8 VR6 Motronic, 2.0 Simos) drawn on the shared self-diagnosis sheet.
      source: { ref: vw-wd-1997, locator: "No. 2/2" }
    - codes: [J255]
      reason: Climatronic control unit; the car is taken to have the manual air conditioner (diagram No. 74), which the ADAC lists as standard. Open question until the car's equipment is known.
      source: { ref: vw-wd-1997, locator: "No. 2/3" }
    - codes: [J17]
      reason: Fuel pump relay of the petrol engines, drawn on the shared dash-panel-insert sheet; on the AHU the same slot (24) of the lower relay plate holds the glow plug relay J52.
      source: { ref: vw-fitting-locations-1997, locator: "000566860204-011, No. 4/11" }
    - codes: [J447]
      reason: Immobilizer relay "up to December 1997"; from January 1998 the push-in bridge TV23 takes its place.
      source: { ref: vw-wd-1997, locator: "No. 1/3, No. 14/2" }
    - codes: [N125, N126]
      reason: Differential lock (EDS, Ford "TCS") valves, "only models with EDS"; taken as not fitted. Open question until the car's equipment is known.
      source: { ref: vw-wd-1997, locator: "No. 20/3" }

