# Ford Galaxy (first generation, WGR), 1998, 1.9 TDI 66 kW (engine code AHU), 5-speed manual,
# left-hand drive (EU).
#
# The Galaxy was built by AutoEuropa (Palmela, Portugal) on the same platform as the VW Sharan (7M)
# and SEAT Alhambra: body structure, running gear, VW engines and gearbox and most of the electrical
# system are shared. The facts in this folder come from Volkswagen's official Sharan documentation
# (workshop manuals, current flow diagrams, self-study programmes; see sources.yaml), which is the
# OEM documentation of the shared parts. Parts Ford styled for the Galaxy (front and rear styling,
# the instrument-panel fascia, the radio) are not covered by it and say so.
#
# Coordinates everywhere in this folder: ISO 8855 vehicle frame, millimetres.
#   +X forward, +Y left, +Z up; origin on the ground, on the centreline,
#   directly under the front axle. Rotations: degrees, XYZ order.
# Mirrored pairs (`sides: [left, right]`) are authored for the LEFT (+Y)
# side; the build reflects the right-hand copy.
# Handed parts (`handed: true`: pedals, steering, glovebox…) are authored for
# LEFT-hand drive; a right-hand-drive variant reflects them.
#
# Variant assumptions still to confirm (no VIN yet) are listed in
# docs/verification.md ("Open questions").

id: ford-galaxy-wgr-1998-19tdi
make: Ford
model: Galaxy
generation: { code: WGR, years: [1995, 2000] }
modelYear: 1998
variant:
  name: 1.9 TDI
  engine: 1.9 TDI 66 kW (VW engine code AHU) I4 direct-injection turbodiesel, distributor pump
  transmission: 5-speed manual (VW/Ford gearbox 006)
  drive: Front-wheel drive
  body: 5-door MPV, 5–7 seats
  market: EU (left-hand drive)
  steering: left
aliases: [Galaxy Mk1, Galaxy 1, WGR, Galaxy TDI, VW Sharan 7M, SEAT Alhambra, AutoEuropa MPV]
# The owner's car is blue; the Ford paint name and code are not known yet, so a generic mid blue is shown.
bodyColor: '#2f5185'
disclaimer: >-
  Educational model built from Volkswagen's official documentation for the VW Sharan, which shares its
  platform, engines, gearbox and most of its wiring with the first-generation Ford Galaxy. Parts Ford
  styled for the Galaxy are not covered by those documents and are marked as estimated. Shapes are
  simplified unless a component's verification panel says otherwise. Always confirm against the
  workshop manual before working on a vehicle.

