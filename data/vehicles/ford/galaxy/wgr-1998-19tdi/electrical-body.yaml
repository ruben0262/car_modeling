    verification: { sources: [{ ref: ru-manual, locator: "shar_el_body_rus.pdf p. 1" }, { ref: vw-wd-1997, locator: "No. 4/4", says: "M29 Dipped beam bulb, left; M31 Dipped beam bulb, right" }] }
