# Body electrics: exterior lighting, wipers and washers, horns, central locking, windows, mirrors, sunroof,
# anti-theft alarm and the harness runs into the doors, tailgate and roof. Codes and locations from the VW current
# flow diagrams (diagrams 4, 5, 8, 21–23, 37, 39, 47, 56, 62) and fitting locations; bulbs and lamp work from the
# workshop book's body-electrics chapter (ru-manual, shar_el_body_rus.pdf), which covers the Galaxy. The lamp
# housings, bumpers and wings are Ford parts not drawn in the VW documents, so everything in them is estimated.
# Parts inside a lamp, mirror, door or tailgate are children of it (local frame where the parent has a placement).
system: electrical
defaults:
  verification:
    geometry: schematic
    placement: estimated
    facts: oem
    sources: [{ ref: vw-wd-1997, locator: "No. 4/1–4/9" }]

nodes:
