    explode: { dir: [-1, 0, 0.3], dist: 200 }
    geometry: { gen: tube, r: 12, points: [[-700, 560, 640], [-760, 500, 760], [-800, 400, 900], [-800, 360, 1000], [-800, 200, 1000], [-800, 0, 980], [-800, -300, 960], [-800, -620, 900], [-760, -680, 700]] }
  - id: dash-harness-console
    kind: harness
    material: harness-black
    name: Centre console harness
    harness: { connects: [dash-harness, diagnosis-connector] }
    explode: { dir: [-1, 0, 0.3], dist: 200 }
    geometry: { gen: tube, r: 8, points: [[-800, 0, 980], [-810, 0, 860], [-815, 0, 780]] }
  - id: bulkhead-grommet-harness
    kind: harness
