# Body, comfort, restraint and infotainment electrics: the wiring-diagram
# components that are not part of another system's file, plus the harness
# trunks that reach them (seats, doors, tailgate, bumpers, right-hand floor).
#
# Locations come from the workshop manual (`wsm`, cited by PDF page). Where the
# manual names only the area, `placement: estimated` says so. Optional
# equipment carries a `fitment` note: the car's specification is unknown
# without a VIN.
system: electrical
defaults:
  material: plastic-black
  verification:
    geometry: schematic
    placement: referenced
    facts: oem
    sources: [{ ref: wsm }, { ref: ewd }]

nodes:
  # ================================================================ restraints (crash sensing)
  - id: front-impact-sensor
    kind: part
    sides: [left, right]
    handed: true
    name: Front impact sensor
    aliases: [front crash sensor, airbag crash sensor, front airbag sensor]
    summary: Accelerometer with its own microchip, powered by the restraints control module (RCM). It continuously sends 'digital acceleration' messages to the RCM, which decides whether to fire the airbags and pretensioners. On a fault it sends a fault message instead, and the RCM lights the airbag warning lamp.
    location: { zone: front-end, text: "Front end behind the bumper cover, one each side (driver's side and passenger's side)" }
    access: { from: [front-end], notes: "The manual gives no removal procedure; disconnect the battery and wait before working on any SRS part." }
    placement: { pos: [742, 515, 690] }
    contacts: [radiator-support]
    explode: { dir: [1, 0.3, 0.2], dist: 200 }
    ewd: [T392:l, T393:r]
    partNumbers: [{ number: YDB500410, note: "Crash sensor, front (listed as no longer available)", source: { ref: jlr-parts-airbag } }]
    verification:
      placement: estimated
      sources:
        - { ref: wsm, locator: "pp. 2199–2200", says: "16 - Impact sensor - left-hand front; 17 - Impact sensor - right-hand front. The impact sensors are installed in the front and both sides of the vehicle." }
        - { ref: jlr-parts-airbag }
        - { ref: fixya-crash-sensor }
    geometry: { gen: box, size: [40, 50, 40], r: 5 }

  - id: side-impact-sensor-b-pillar
    kind: part
    sides: [left, right]
    handed: true
    name: Side impact sensor (B-pillar)
    aliases: [side crash sensor, B-pillar crash sensor]
    summary: Lateral accelerometer at the foot of the B-pillar. Together with the C-pillar sensor it lets the RCM detect a side impact quickly enough to fire that side's seat airbag and curtain.
    location: { zone: cabin-front, text: "Base of the B-pillar, under the front scuff plate trim" }
    access: { from: [cabin-front], removeFirst: [front-scuff-plate], tools: [Torx socket], notes: "Remove the front scuff plate trim panel. Sensor fixing 10 Nm.", sources: [{ ref: wsm, locator: p. 2209 }] }
    placement: { pos: [-1410, 790, 530] }
    contacts: [b-pillar, sill, b-pillar-trim]
    explode: { dir: [0, -1, 0.3], dist: 160 }
    ewd: [T394:l, T395:r]
    specs: [{ label: Fixing torque, value: "10 Nm", source: { ref: wsm, locator: p. 2209 } }]
    partNumbers: [{ number: YDB500400, note: "Crash sensor, side (the catalogue lists one side sensor part)", source: { ref: jlr-parts-airbag } }]
    verification:
      sources:
        - { ref: wsm, locator: "pp. 2197, 2200, 2209", says: "Side impact sensor - B-pillar ... Remove the front scuff plate trim panel" }
        - { ref: jlr-parts-airbag }
    geometry: { gen: box, size: [50, 30, 45], r: 5 }

  - id: side-impact-sensor-c-pillar
    kind: part
    sides: [left, right]
    handed: true
    name: Side impact sensor (C-pillar)
    aliases: [rear side crash sensor, C-pillar crash sensor]
    summary: Second lateral accelerometer each side, at the lower C-pillar behind the rear quarter trim. Gives the RCM a rear reference for side impacts and rear-door intrusions.
    location: { zone: cabin-rear, text: "Lower C-pillar, behind the rear quarter trim panel" }
    access: { from: [cabin-rear], removeFirst: [rear-quarter-trim], notes: "Remove the rear quarter trim panel. Sensor fixing 10 Nm.", sources: [{ ref: wsm, locator: p. 2211 }] }
    placement: { pos: [-2440, 790, 930] }
    contacts: [c-pillar, c-pillar-trim]
    explode: { dir: [0, -1, 0.3], dist: 160 }
    ewd: [T396:l, T397:r]
    specs: [{ label: Fixing torque, value: "10 Nm", source: { ref: wsm, locator: p. 2211 } }]
    partNumbers: [{ number: YDB500400, note: "Crash sensor, side (the catalogue lists one side sensor part)", source: { ref: jlr-parts-airbag } }]
    verification:
      placement: estimated
      sources:
        - { ref: wsm, locator: "pp. 2197, 2200, 2211", says: "Side impact sensor - C-pillar ... Remove the rear quarter trim panel" }
        - { ref: jlr-parts-airbag }
    geometry: { gen: box, size: [50, 30, 45], r: 5 }

  - id: belt-minder-mat
    parent: seat-passenger
    kind: part
    name: Belt-minder occupancy mat
    aliases: [occupancy sensor, seat occupancy mat, seat belt reminder sensor]
    summary: Foil contact circuit in a plastic sheet. Weight on the seat lowers its resistance, so the RCM knows the passenger seat is occupied and sounds the belt-minder if the belt is not fastened (markets other than North America and Australia).
    location: { zone: cabin-front, text: "In the front passenger seat cushion, between the foam padding and the cover" }
    access: { from: [cabin-front], notes: "Part of the seat cushion; the cushion cover must come off." }
    placement: { pos: [40, 0, 433] }
    explode: { dir: [0, 0, 1], dist: 140 }
    ewd: [D358]
    verification: { sources: [{ ref: wsm, locator: "pp. 2199, 2202", says: "The occupancy sensor is installed in the cushion of the front passenger seat between the foam padding and the cover" }] }
    geometry: { gen: box, size: [300, 300, 4], mat: plastic-white }

  - id: seat-position-sensor
    parent: seat-driver
    kind: part
    name: Driver seat position sensor
    aliases: [seat track sensor, seat track position sensor]
    summary: Hall-effect sensor actuated by a target bracket on the seat slide. It tells the RCM whether the driver sits forward or rearward, so the RCM can choose the driver airbag's inflation stage.
    location: { zone: cabin-front, text: "Underside of the driver's seat, on the seat slide" }
    access: { from: [cabin-front] }
    placement: { pos: [120, -200, 45] }
    explode: { dir: [0, -0.5, -1], dist: 120 }
    ewd: [T360]
    verification: { placement: estimated, sources: [{ ref: wsm, locator: p. 2203, says: "fitted to the underside of the driver's seat. The sensor is actuated by the target bracket attached to the seat slide" }] }
    geometry: { gen: box, size: [40, 25, 30], r: 4 }

  # ================================================================ driver's seat (power, memory, heating — optional in Europe)
  - id: driver-seat-height-motor
    parent: seat-driver
    kind: part
    name: Driver's seat height motor
    fitment: Power-adjusted seats (option outside North America)
    summary: Permanent-magnet motor driving a rack-and-pinion adjuster. On memory seats a Hall sensor inside the motor reports its position to the power seat module.
    location: { zone: cabin-front, text: "Under the driver's seat cushion, on the seat frame" }
    placement: { pos: [-140, 150, 225] }
    explode: { dir: [0, 0.3, -1], dist: 120 }
    ewd: [M221]
    verification: { placement: estimated, sources: [{ ref: wsm, locator: "pp. 1904, 1907–1908" }] }
    geometry: { gen: cyl, r: 22, h: 80, axis: y, mat: steel-black }
  - id: driver-seat-slide-motor
    parent: seat-driver
    kind: part
    name: Driver's seat slide motor
    fitment: Power-adjusted seats (option outside North America)
    summary: Drives both seat runners through flexible shafts to move the seat forward and rearward.
    location: { zone: cabin-front, text: "Front of the driver's seat frame, between the runners" }
    placement: { pos: [170, 0, 70] }
    explode: { dir: [0.4, 0, -1], dist: 120 }
    ewd: [M241]
    verification: { placement: estimated, sources: [{ ref: wsm, locator: "pp. 1904, 1907" }] }
    geometry: { gen: cyl, r: 22, h: 90, axis: y, mat: steel-black }
  - id: driver-seat-tilt-motor
    parent: seat-driver
    kind: part
    name: Driver's seat cushion tilt motor
    fitment: Driver's memory seat
    summary: Raises or lowers the front edge of the cushion.
    location: { zone: cabin-front, text: "Front of the driver's seat frame, outboard" }
    placement: { pos: [210, 150, 225] }
    explode: { dir: [0.4, 0.3, -1], dist: 120 }
    ewd: [M311]
    verification: { placement: estimated, sources: [{ ref: wsm, locator: p. 1908 }] }
    geometry: { gen: cyl, r: 20, h: 70, axis: y, mat: steel-black }
  - id: driver-seat-recline-motor
    parent: seat-driver
    kind: part
    name: Driver's seat backrest recline motor
    fitment: Power-adjusted seats (option outside North America)
    summary: Turns the backrest recliner mechanism at the backrest pivot.
    location: { zone: cabin-front, text: "At the driver's seat backrest pivot, outboard side" }
    placement: { pos: [-200, 232, 330] }
    explode: { dir: [-0.3, 1, 0], dist: 120 }
    ewd: [M312]
    verification: { placement: estimated, sources: [{ ref: wsm, locator: "pp. 1904, 1907" }] }
    geometry: { gen: cyl, r: 22, h: 60, axis: y, mat: steel-black }
  - id: driver-lumbar-pump
    parent: seat-driver
    kind: part
    name: Driver's lumbar support pump
    fitment: Electric lumbar support (driver's seat only)
    summary: Small pump that inflates the lumbar bladders in the backrest. Lumbar position is not stored by the memory system.
    location: { zone: cabin-front, text: "Inside the driver's seat backrest" }
    placement: { pos: [-300, 0, 560] }
    explode: { dir: [-1, 0, 0.3], dist: 140 }
    ewd: [M286]
    verification: { placement: estimated, sources: [{ ref: wsm, locator: "pp. 1904, 1910" }] }
    geometry: { gen: box, size: [50, 90, 60], r: 8 }
  - id: driver-seat-switch-pack
    parent: seat-driver
    kind: part
    name: Driver's seat switch pack
    aliases: [seat control switch, seat adjustment switch]
    fitment: Power-adjusted seats (option outside North America)
    summary: Switch pack on the outboard side of the seat base. Non-memory seats switch the motors directly; memory seats route the switches through the power seat module, and the pack carries the memory buttons. Includes the lumbar switch. The wiring diagrams draw the same individual height, slide, recline and tilt switches inside both front seat packs.
    location: { zone: cabin-front, text: "Outboard side of the driver's seat base" }
    access: { from: [cabin-front], sources: [{ ref: wsm, locator: p. 1931 }] }
    placement: { pos: [120, 262, 225] }
    explode: { dir: [0, 1, 0], dist: 140 }
    ewd: [S391, S389, S435, S436, S437, S438, S439, S440, S441, S442]
    verification: { sources: [{ ref: wsm, locator: "pp. 1907–1909", says: "Movement of the seat is achieved using the control switch pack located on the outboard side of the seat" }] }
    geometry: { gen: box, size: [150, 22, 60], r: 8, mat: interior-trim }
  - id: memory-seat-module
    parent: seat-driver
    kind: part
    name: Power seat module (memory)
    aliases: [driver seat module, DSM, seat memory module]
    fitment: Driver's memory seat
    summary: Stores up to three seat positions using the Hall sensors in the seat motors, and asks the door modules to recall the matching mirror positions. Connected on the medium-speed CAN bus and powered directly from the AJB.
    location: { zone: cabin-front, text: "Under the driver's seat frame" }
    access: { from: [cabin-front], sources: [{ ref: wsm, locator: p. 1809 }] }
    placement: { pos: [-60, 0, 110] }
    explode: { dir: [0, 0, -1], dist: 140 }
    ewd: [D119]
    verification: { sources: [{ ref: wsm, locator: "pp. 1908, 1915", says: "The seat incorporates a power seat module located under the seat frame" }] }
    geometry: { gen: enclosure, size: [160, 110, 35], lid: false, sockets: 3, socketFace: x+ }
  - id: driver-seat-heating-module
    parent: seat-driver
    kind: part
    name: Driver's seat heating module
    fitment: Heated front seats
    summary: Switches the cushion and backrest heater elements. Takes its demand from the climate control (ATC) module on the LIN bus; powered from the AJB and grounded locally.
    location: { zone: cabin-front, text: "Beneath the driver's seat" }
    placement: { pos: [110, -90, 100] }
    explode: { dir: [0.3, -0.3, -1], dist: 140 }
    ewd: [D408]
    verification: { sources: [{ ref: wsm, locator: "pp. 1801, 1910", says: "A seat heating module and electrical wiring is located beneath each front seat" }] }
    geometry: { gen: enclosure, size: [110, 70, 28], lid: false, sockets: 2, socketFace: x+ }
  - id: driver-seat-heater-elements
    parent: seat-driver
    kind: part
    name: Driver's seat heater elements (cushion and backrest)
    fitment: Heated front seats
    summary: Heating mats under the cushion and backrest covers. The cushion mat carries the thermistor that the heating module uses to regulate temperature.
    location: { zone: cabin-front, text: "Under the driver's seat cushion and backrest covers" }
    access: { from: [cabin-front], sources: [{ ref: wsm, locator: p. 1930 }] }
    explode: { dir: [0, 0, 1], dist: 160 }
    ewd: [H148, H149, H139]
    verification: { sources: [{ ref: wsm, locator: p. 1910, says: "A heating element is incorporated within each seat cushion and squab" }] }
    geometry:
      gen: compound
      parts:
        - { gen: box, size: [400, 380, 3], pos: [30, 0, 436], mat: plastic-grey }
        - { gen: box, size: [3, 380, 470], pos: [-240, 0, 730], rot: [0, -18, 0], mat: plastic-grey }

