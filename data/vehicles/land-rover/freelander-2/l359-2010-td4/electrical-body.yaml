    explode: { dir: [0, -1, 0], dist: 140 }
    ewd: [S392]
    verification: { sources: [{ ref: wsm, locator: p. 1907 }] }
    geometry: { gen: box, size: [150, 22, 60], r: 8, mat: interior-trim }
  - id: passenger-seat-heating-module
    parent: seat-passenger
    kind: part
    name: Passenger seat heating module
    fitment: Heated front seats
    location: { zone: cabin-front, text: "Beneath the passenger seat" }
    placement: { pos: [110, 90, 100] }
    explode: { dir: [0.3, 0.3, -1], dist: 140 }
    ewd: [D409]
    verification: { sources: [{ ref: wsm, locator: "pp. 1801, 1910" }] }
    geometry: { gen: enclosure, size: [110, 70, 28], lid: false, sockets: 2, socketFace: x+ }
  - id: passenger-seat-heater-elements
    parent: seat-passenger
    kind: part
    name: Passenger seat heater elements (cushion and backrest)
    fitment: Heated front seats
    location: { zone: cabin-front, text: "Under the passenger seat cushion and backrest covers" }
    explode: { dir: [0, 0, 1], dist: 160 }
    ewd: [H150, H151]
    verification: { sources: [{ ref: wsm, locator: p. 1910 }] }
    geometry:
      gen: compound
      parts:
        - { gen: box, size: [400, 380, 3], pos: [30, 0, 437], mat: plastic-grey }
        - { gen: box, size: [3, 380, 470], pos: [-240, 0, 730], rot: [0, -18, 0], mat: plastic-grey }
  - id: power-seat-relay
    parent: seat-passenger
    kind: part
    name: Power seat relay (RH seat)
    fitment: Power-adjusted passenger seat
    summary: Relay in the right-hand seat feed, drawn on the auxiliary junction box and seat sheets with its own connectors in the seat harness.
    location: { zone: cabin-front, text: "Seat harness under the right-hand front seat" }
    placement: { pos: [-110, 80, 95] }
    explode: { dir: [-0.3, 0.3, -1], dist: 120 }
    ewd: [R210]
    verification: { placement: estimated, sources: [{ ref: ewd, locator: "414-01 Auxiliary junction box 02/03; 501-10 Memory 02/02" }] }
    geometry: { gen: box, size: [30, 30, 40], r: 3 }

  # ================================================================ seat harnesses (to the floor harness)
  - id: driver-seat-harness
    parent: seat-driver
    kind: harness
    name: Driver's seat harness
    summary: Under-seat harness to the motors, modules, side airbag, pretensioner and sensors; joins the floor harness at the seat connector block under the seat.
    location: { zone: cabin-front, text: "Under the driver's seat" }
    harness: { connects: [memory-seat-module, driver-seat-heating-module, seat-position-sensor] }
    explode: { dir: [0, 0, -1], dist: 100 }
    verification: { placement: estimated, sources: [{ ref: wsm, locator: p. 2205, says: "a connector in the main seat harness connector block located under the front seat" }] }
    geometry: { gen: tube, r: 7, points: [[60, 300, 105], [40, 160, 95], [-20, 40, 95], [-60, 0, 100], [60, -60, 100], [120, -180, 50]] }
  - id: passenger-seat-harness
    parent: seat-passenger
    kind: harness
    name: Passenger seat harness
    location: { zone: cabin-front, text: "Under the passenger seat" }
    harness: { connects: [passenger-seat-heating-module, power-seat-relay] }
    explode: { dir: [0, 0, -1], dist: 100 }
    verification: { placement: estimated, sources: [{ ref: wsm, locator: p. 2205 }] }
    geometry: { gen: tube, r: 7, points: [[60, -300, 105], [40, -160, 95], [-60, -40, 95], [-110, 60, 95], [80, 80, 100]] }

  # ================================================================ navigation and infotainment
  - id: navigation-computer
    kind: part
    name: Navigation computer (DVD map drive)
    aliases: [sat nav unit, navigation module, DVD drive]
    fitment: Satellite navigation
    summary: Reads the map DVD and calculates the route; on the MOST fibre-optic ring with the touch screen and audio units. Uses the GPS antenna, wheel speeds from the ABS module and, in Europe, TMC traffic messages.
    location: { zone: cabin-front, text: "Under the right-hand front seat" }
    access: { from: [cabin-front], notes: "Fixings 6 Nm. Configure a new unit with the approved diagnostic system.", sources: [{ ref: wsm, locator: p. 1629 }] }
    placement: { pos: [-1560, -430, 380] }
    contacts: [floor-front-r, seat-passenger]
    explode: { dir: [0, -0.4, -1], dist: 200 }
    ewd: [D325]
    specs: [{ label: Fixings, value: "6 Nm", source: { ref: wsm, locator: p. 1629 } }]
    verification: { sources: [{ ref: wsm, locator: "pp. 1609, 1629", says: "The navigation computer located under the right-hand front seat, houses the DVD drive" }] }
    geometry: { gen: enclosure, size: [250, 190, 60], lid: false, sockets: 4, socketFace: x+, mat: steel-black }
  - id: voice-recognition-module
    kind: part
    name: Voice recognition module
    fitment: Satellite navigation / telephone with voice control
    summary: Drawn only on the ground distribution sheet, next to the navigation module. The manual does not describe its location; it is shown beside the navigation computer until a reviewer confirms it.
    location: { zone: cabin-front, text: "Not described in the manual (shown next to the navigation computer)" }
    placement: { pos: [-1360, -430, 365] }
    contacts: [floor-front-r, seat-passenger, seat-crossmember-r]
    explode: { dir: [0, -0.4, -1], dist: 200 }
    ewd: [D262]
    verification: { placement: estimated, notes: "Location unknown — placeholder position.", sources: [{ ref: ewd, locator: "414-01 Ground distribution 03/05" }] }
    geometry: { gen: box, size: [120, 90, 35], r: 4, mat: steel-black }
  - id: touch-screen-display
    kind: part
    name: Touch screen display
    aliases: [TSD, sat nav screen, centre screen]
    fitment: Satellite navigation
    summary: The navigation and infotainment interface in the centre of the instrument panel, on the MOST ring.
    location: { zone: cabin-dashboard, text: "Centre of the instrument panel" }
    access: { from: [cabin-front], removeFirst: [audio-head-unit], sources: [{ ref: wsm, locator: p. 1635 }] }
    placement: { pos: [-1003, 0, 1048], rot: [0, -12, 0] }
    contacts: [dashboard, audio-head-unit]
    explode: { dir: [-1, 0, 0.3], dist: 220 }
    ewd: [D326]
    verification: { sources: [{ ref: wsm, locator: "pp. 1610, 1635", says: "The touch screen display is located in the center of the instrument panel" }] }
    geometry: { gen: box, size: [30, 230, 130], r: 6, mat: trim-black }
  - id: centre-switch-pack
    kind: part
    name: Instrument panel centre switch pack
    aliases: [hazard switch, central locking switch, park aid switch]
    summary: Row of switches above the touch screen. The wiring diagrams draw the hazard warning switch and the central lock and unlock switches inside it; the parking aid switch is the left-hand switch.
    location: { zone: cabin-dashboard, text: "Centre of the instrument panel, above the touch screen" }
    access: { from: [cabin-front] }
    placement: { pos: [-956, 0, 1126], rot: [0, -35, 0] }
    contacts: [dashboard]
    explode: { dir: [-1, 0, 0.5], dist: 220 }
    ewd: [S425, S121, S319, S381]
    verification: { sources: [{ ref: wsm, locator: p. 1528, says: "The parking aid switch is located in the instrument panel switch pack, above the touch screen. The switch is the LH switch" }, { ref: ewd, locator: "413-00 01/01; 501-14 Central locking system 01/03" }] }
    geometry: { gen: box, size: [30, 230, 40], r: 6, mat: interior-trim }
  - id: ip-speaker
    kind: part
    sides: [left, right]
    name: Instrument panel mid-range speaker
    fitment: Premium (surround) audio
    summary: Mid-range speaker in the top of the instrument panel, part of the surround-sound configuration.
    location: { zone: cabin-dashboard, text: "Top of the instrument panel, near the windscreen corner" }
    placement: { pos: [-730, 600, 1150] }
    contacts: [dashboard]
    explode: { dir: [0, 0, 1], dist: 160 }
    ewd: [F104:l, F103:r]
    verification: { placement: estimated, sources: [{ ref: wsm, locator: p. 1616, says: "2 Mid range speakers mounted on the instrument panel" }] }
    geometry: { gen: cyl, r: 42, h: 30, axis: z, mat: interior-dark }
  - id: centre-speaker
    kind: part
    name: Centre fill speaker
    fitment: Premium (surround) audio
    location: { zone: cabin-dashboard, text: "Centre of the instrument panel top" }
    placement: { pos: [-730, 0, 1150] }
    contacts: [dashboard]
    explode: { dir: [0, 0, 1], dist: 160 }
    ewd: [F187]
    verification: { placement: estimated, sources: [{ ref: wsm, locator: p. 1616, says: "1 center fill speaker centrally located in the instrument panel" }] }
    geometry: { gen: box, size: [80, 150, 30], r: 8, mat: interior-dark }
  - id: surround-speaker
    kind: part
    sides: [left, right]
    name: Rear surround speaker
    fitment: Premium (surround) audio
    location: { zone: cabin-rear, text: "Rear C-pillar trim" }
    placement: { pos: [-2470, 712, 1300] }
    contacts: [c-pillar, c-pillar-trim]
