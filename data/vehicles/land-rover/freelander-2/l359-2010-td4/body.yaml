# Exterior body: panels are cut from the parametric body surface
# (vehicle.yaml shapes.body). t: 0 sill · 1 beltline · 2 roof edge · 3 centre
# (mirrored 3…6 on the right). "z:600" = where the side reaches 600 mm.
system: body
defaults:
  material: paint
  verification:
    geometry: schematic
    placement: estimated
    facts: unsourced
    notes: The body surface is fitted to the published length, width, height and wheelbase; panel split lines are estimated. Gaps follow the manual's gap-and-profile chart (wsm pp. 2257–2261).

nodes:
