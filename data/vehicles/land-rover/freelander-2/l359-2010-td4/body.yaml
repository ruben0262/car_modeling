    access: { from: [exterior], removeFirst: [front-door-trim-panel], sources: [{ ref: wsm, locator: p. 1810 }] }
    material: plastic-black
    ewd: [D253:l, D254:r]
    verification: { placement: estimated, facts: oem, sources: [{ ref: wsm, locator: "pp. 1810, 1966, 2039" }, { ref: ewd }] }
