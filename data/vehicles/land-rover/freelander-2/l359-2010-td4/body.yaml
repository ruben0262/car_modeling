    kind: part
    name: Front bumper cover
    aliases: [front bumper, bumper cover]
    summary: Painted upper cover with black textured lower valance; carries the grille surround mounts.
    location: { zone: exterior-front, text: "Front of vehicle, below the headlamps" }
    access: { from: [front-end, underside], notes: "Fixings at the wheel-arch liners, undertray and upper bracket (sequence to be confirmed against the workshop manual)." }
    explode: { dir: [1, 0, -0.1], dist: 480 }
    geometry:
      gen: compound
      parts:
        - { gen: body-panel, x: [440, 880], t: [0, 'z:600'], mat: trim-black }
        - { gen: body-panel, x: [440, 880], t: ['zr:600', 6], mat: trim-black }
        - { gen: body-panel, x: [440, 880], t: ['z:600', 'z:720'], mat: paint }
        - { gen: body-panel, x: [440, 880], t: ['zr:720', 'zr:600'], mat: paint }
        - { gen: body-cap, end: front, z: [470, 600], mat: trim-black }
        - { gen: body-cap, end: front, z: [600, 720], mat: paint }

