    parent: front-door
    kind: part
    name: Front door module
    aliases: [door control module, FDM, DDM]
    summary: Control module on the door inner panel. It drives the window and lock motors and the door mirror, reads the latch ajar switch and the window switches, and talks to the CJB on the medium-speed CAN bus. Driver's door on the left (LHD).
