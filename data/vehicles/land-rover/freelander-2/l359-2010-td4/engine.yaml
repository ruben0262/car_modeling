    kind: part
    name: Exhaust camshaft pulley (42 teeth)
    explode: { dir: [1, 0, 0.3], dist: 120 }
    specs: [{ label: Teeth, value: "42, keyed and bolted to the exhaust camshaft", source: { ref: wsm, locator: p. 607 } }]
    geometry: { gen: pulley, r: 62, w: 26, ribs: 0, mat: steel-zinc, pos: [497, -58, 360] }
  - id: timing-belt-tensioner
    parent: timing-drive
    kind: part
    name: Timing belt automatic tensioner
    explode: { dir: [1, 0.5, 0], dist: 120 }
    geometry: { gen: pulley, r: 28, w: 26, ribs: 0, mat: steel-zinc, pos: [497, 88, 135] }
  - id: coolant-pump
