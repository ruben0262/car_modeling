      - { label: Bores, value: "Machined directly into the block — no liners", source: { ref: wsm, locator: p. 584 } }
    specs:
      - { label: Identification, value: "Engine number on the lower LH (oil filter) side of the block", source: { ref: wsm, locator: p. 580 } }
    geometry: { gen: engine-block, len: 470, y: [-150, 165], z: [-90, 250], bores: [96, 189, 282, 375], boreR: 46 }

