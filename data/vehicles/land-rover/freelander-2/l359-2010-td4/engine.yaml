# 2.2L Duratorq TD4 (DW12 family) — sourced from the JLR workshop manual
# (source `wsm`, PDF page numbers) and the LHD wiring diagrams (`ewd`).
#
# Engine-local frame (used by every node under engine-assembly):
#   origin on the crankshaft axis at the flywheel face,
#   +X along the crank towards the timing-belt end ("front of engine" in the manual),
#   +Y towards the intake side (the manual's engine LH side), +Z along the cylinders.
# Installed transverse, timing end on the vehicle's right, intake facing the radiator,
# "tilted 12 degrees toward rear" (wsm p.579) → rot [0, -12, -90].
#   Generator "at the front of the engine on the LH side of the cylinder block" (p.1569)
#   appears at the radiator side in the vehicle location figure (p.1555) → engine LH = vehicle front.
# Cylinders are numbered from the transmission end: No.1 at x≈96, No.4 at x≈375 (p.579).
system: engine
defaults:
  verification:
    geometry: schematic
    placement: referenced
    facts: oem
    sources:
      - { ref: wsm, locator: "pp. 576–623, Engine – TD4 2.2L Diesel, Description and Operation" }

nodes:
  - id: engine-assembly
    kind: assembly
    name: Engine — 2.2L Duratorq TD4 diesel
    aliases: [engine, motor, DW12, Duratorq, TD4 engine, 224DT, 2.2L Duratorq-TDCi]
    summary: Transverse 2.2-litre four-cylinder common-rail turbodiesel, twin overhead cams, 16 valves, two balance shafts.
    function: Converts diesel fuel into torque at the crankshaft, delivered through the clutch, gearbox and power transfer unit to all four wheels.
    location: { zone: engine-bay, text: "Transverse; timing belt at the right, gearbox at the left, intake side towards the radiator, leaning 12° rearwards" }
    placement: { pos: [180, 60, 450], rot: [0, -12, -90] }
    explode: { dir: [0, 0, 1], dist: 0 }
    specs:
      - { label: Type, value: "2.2 litre inline 4, turbocharged and intercooled diesel, DOHC, 4 valves per cylinder", source: { ref: wsm, locator: p. 575 } }
      - { label: Bore × stroke, value: "85.0 × 96.0 mm, 2179 cm³", source: { ref: wsm, locator: p. 575 } }
      - { label: Firing order, value: "1-3-4-2 (No.1 at the gearbox end)", source: { ref: wsm, locator: p. 575 } }
      - { label: Compression ratio, value: "15.8:1", source: { ref: handbook, locator: Technical specifications } }
      - { label: Installation, value: "Transverse, tilted 12° toward the rear", source: { ref: wsm, locator: p. 579 } }
      - { label: Output (pre-2011 TD4), value: "160 PS, 400 Nm", source: { ref: carfolio-fl2-td4 } }
      - { label: Oil capacity, value: "5.9 L service fill, 6.5 L dry; 1.5 L between dipstick marks", source: { ref: wsm, locator: p. 574 } }
      - { label: Oil specification, value: "SAE 5W-30 to Ford WSS-M2C13B, or ACEA A1/B1", source: { ref: wsm, locator: p. 574 } }
    manufacturing:
      - { label: Fuel system, value: "Bosch Generation 3 common rail, 1600 bar", source: { ref: wsm, locator: "pp. 576, 801" } }
      - { label: Engine management, value: "Bosch EDC16 (p. 579) — the specification page lists EDC 15 C2 (p. 987); conflict open", source: { ref: wsm, locator: "pp. 579, 987" } }
      - { label: Turbocharger, value: "Garrett, Rotary Electronic Actuated (REA) variable geometry", source: { ref: wsm, locator: p. 579 } }
      - { label: Flywheel, value: "Dual-mass (manual transmission)", source: { ref: wsm, locator: "pp. 579, 1148" } }
    verification:
      notes: "Orientation and cylinder numbering are taken from the manual. The crank position (x 180 mm ahead of the front axle, 450 mm high) is still estimated."

