    access: { from: [underside], tools: [Drain-plug socket, Oil drain tray], notes: "Drain plug at the rear RH (gearbox end, bulkhead side) of the pan.", sources: [{ ref: wsm, locator: p. 598 }] }
    explode: { dir: [0, 0, -1], dist: 260 }
    manufacturing:
      - { label: Housing, value: "Aluminium, 20 bolts to the block; also carries the lower transmission mountings", source: { ref: wsm, locator: p. 597 } }
      - { label: Pan, value: "Pressed steel, liquid sealant, 21 captive bolts", source: { ref: wsm, locator: p. 598 } }
    geometry: { gen: oil-sump, x: [20, 450], y: [-140, 150], z: [-250, -90], ladder: 55, plug: [60, -90] }

