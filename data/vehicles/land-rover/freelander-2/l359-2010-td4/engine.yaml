    explode: { dir: [0, 0, 1], dist: 250 }
    manufacturing:
      - { label: Material, value: "Aluminium alloy, machined upper surface", source: { ref: wsm, locator: p. 606 } }
    geometry: { gen: cam-cover, len: 460, y: [-120, 130], z: [365, 425], injectors: [96, 189, 282, 375], injectorY: 5, filler: 40 }

  - id: engine-cover
