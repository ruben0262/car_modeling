    explode: { dir: [1, 0, 0], dist: 260 }
    material: plastic-black
    manufacturing: [{ label: Material, value: "Plastic, 1-piece rear + 2-piece front, 9 screws", source: { ref: wsm, locator: p. 603 } }]
    geometry:
      gen: prism
      plane: yz
      thickness: 36
      bevel: 4
      pos: [489, 0, 0]
      outline: [[-110, -60], [-120, 200], [-110, 390], [-60, 420], [70, 420], [120, 390], [125, 200], [110, 60], [90, -80], [0, -110], [-80, -100]]

  - id: timing-drive
    parent: engine-assembly
    kind: assembly
    detail: true
    name: Camshaft drive (timing belt and chain)
    summary: The crankshaft drives the exhaust camshaft and coolant pump by a toothed belt; a short 40-link chain drives the intake camshaft from the exhaust camshaft.
    explode: { dir: [1, 0, 0], dist: 140 }
    contacts: [timing-belt-cover, crank-pulley, engine-mount-rh, cylinder-block, cylinder-head]
    verification:
      sources: [{ ref: wsm, locator: "pp. 599–602", says: "Crankshaft gear drives the exhaust camshaft via a toothed timing belt routed around the coolant pump, automatic tensioner and idler pulleys; intake camshaft driven by a 40-link chain" }]
  - id: timing-belt
    parent: timing-drive
    kind: part
    name: Timing belt
    aliases: [cam belt, cambelt]
    explode: { dir: [1, 0, 0], dist: 80 }
    verification: { notes: "Routing follows the description; pulley centres are estimated." }
    geometry:
      gen: serpentine
      x: 497
      width: 25
      thickness: 4
      pulleys:
        - { y: 0, z: 0, r: 30 }
        - { y: -96, z: 150, r: 32 }
        - { y: -58, z: 360, r: 64 }
        - { y: 62, z: 268, r: 26, side: -1 }
        - { y: 58, z: 135, r: 30, side: -1 }
  - id: exhaust-cam-pulley
