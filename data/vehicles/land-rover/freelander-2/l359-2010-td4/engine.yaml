    name: Turbocharger — Garrett variable geometry (REA)
    aliases: [turbo, VGT, VNT]
    summary: Exhaust-driven compressor on the exhaust-manifold outlet flange (3 bolts), behind the engine towards the bulkhead. Vane position is set by a rotary electronic actuator.
    location: { zone: engine-bay-rear, text: "Bulkhead side of the engine, on the exhaust manifold" }
    access: { from: [underside, bonnet], removeFirst: [egr-cooler, catalytic-converter], notes: "Manual order: raise the vehicle, remove the EGR cooler, then the catalytic converter.", sources: [{ ref: wsm, locator: p. 825 }] }
    placement: { pos: [235, -300, 180] }
    explode: { dir: [0, -1, 0.15], dist: 300 }
    contacts: [exhaust-manifold]
    ewd: [D363]
    specs:
      - { label: Boost, value: "1.1 bar at 2000 rpm, 1.2 bar at 3000 rpm", source: { ref: wsm, locator: p. 824 } }
      - { label: Turbocharger bolts, value: "24 Nm (new bolts)", source: { ref: wsm, locator: p. 824 } }
    manufacturing: [{ label: Supplier, value: "Garrett — Rotary Electronic Actuated (REA) variable geometry", source: { ref: wsm, locator: p. 579 } }]
    faults:
      - { symptom: "Underboost / limp mode", cause: "Sticking variable vanes, split boost hoses or actuator faults — diagnose before replacing the turbocharger." }
    verification: { sources: [{ ref: wsm, locator: p. 620, says: "The electronically controlled VGT is attached to the exhaust manifold outlet flange with 3 bolts" }] }
