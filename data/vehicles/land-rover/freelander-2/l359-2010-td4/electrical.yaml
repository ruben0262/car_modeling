    placement: { pos: [-740, 350, 560] }
    explode: { dir: [-1, 0, -0.3], dist: 200 }
    ewd: [V100]
    verification: { sources: [{ ref: wsm, locator: "pp. 1643, 1800" }] }
    geometry: { gen: box, size: [30, 50, 22], r: 3, mat: connector-black }

  - id: light-switch-module
    kind: part
    name: Light switch module
    location: { zone: cabin-dashboard, text: "Driver's side of the instrument panel" }
    handed: true
    placement: { pos: [-800, 640, 860], rot: [0, -20, 0] }
    explode: { dir: [-1, 0.4, 0], dist: 200 }
    ewd: [D183, S100, S109, S110, S111]
    verification: { sources: [{ ref: wsm, locator: "pp. 1644, 1801" }] }
    geometry: { gen: box, size: [40, 70, 70], r: 8, mat: interior-trim }

  - id: start-control-unit
    kind: part
    name: Start control unit (keyless start dock)
    location: { zone: cabin-dashboard, text: "In the instrument panel, next to the steering column" }
    handed: true
    placement: { pos: [-820, 210, 905], rot: [0, -20, 0] }
    contacts: [dash-crossbeam, dashboard]
    explode: { dir: [-1, 0, 0.3], dist: 200 }
    ewd: [D391, S449]
    verification: { sources: [{ ref: wsm, locator: p. 1801 }] }
    geometry: { gen: box, size: [60, 50, 40], r: 6, mat: interior-trim }

  - id: headlamp-levelling-module
    kind: part
    name: Headlamp levelling module
    fitment: Xenon headlamps only
    location: { zone: cabin-passenger-footwell, text: "On the bulkhead at the passenger-side A-pillar, behind the glovebox" }
    handed: true
    placement: { pos: [-760, -700, 720] }
    explode: { dir: [0, -1, 0.3], dist: 200 }
    ewd: [D226, D276]
    verification: { sources: [{ ref: wsm, locator: "pp. 1644, 1653" }] }
    geometry: { gen: enclosure, size: [90, 30, 70], lid: false, sockets: 1, socketFace: x+ }

  # ---------------------------------------------------------------- charging & starting (engine mounted)
  - id: alternator
    parent: engine-assembly
    kind: part
    name: Generator (alternator)
    aliases: [alternator, generator, charging alternator]
    summary: Self-exciting generator at the front of the engine on the intake side, with a one-way clutch pulley; regulated over the LIN bus from the ECM.
    location: { zone: engine-bay-front, text: "Front of the engine, radiator side, belt driven" }
    access: { from: [bonnet, front-end], removeFirst: [accessory-belt] }
    explode: { dir: [0, 1, 0.5], dist: 280 }
    placement: { pos: [451, 190, 175] }
    ewd: [M100]
    specs: [{ label: Rating, value: "90/150 A, or 115/180 A on cold-climate vehicles", source: { ref: wsm, locator: p. 1569 } }]
    verification: { sources: [{ ref: wsm, locator: p. 1569, says: "A single self-exciting generator is located at the front of the engine on the LH side of the cylinder block" }] }
    geometry: { gen: machine, kind: alternator, r: 62, len: 118, pulleyR: 30 }

  - id: starter-motor
    parent: engine-assembly
    kind: part
    name: Starter motor
    aliases: [starter]
    summary: Bosch 2.0 kW offset starter on the LH (radiator side) of the clutch housing, 3 fixings; solenoid directly behind the pinion.
    location: { zone: engine-bay-front, text: "Low at the front, where the engine meets the transmission" }
    access: { from: [bonnet, underside], removeFirst: [engine-cover, air-cleaner], sources: [{ ref: wsm, locator: pp. 898–899 }] }
    explode: { dir: [-0.5, 1, -0.6], dist: 260 }
    placement: { pos: [-95, 150, -60], rot: [0, 0, 180] }
    contacts: [gearbox]
    ewd: [M101]
    specs:
      - { label: Make / rating, value: "Bosch, 2.0 kW, 12 V", source: { ref: wsm, locator: p. 877 } }
      - { label: Torques, value: "Bolts 40 Nm; positive terminal nut 12 Nm", source: { ref: wsm, locator: p. 877 } }
    manufacturing: [{ label: Make, value: Bosch, source: { ref: wsm, locator: p. 877 } }]
    verification: { sources: [{ ref: wsm, locator: "pp. 587, 878", says: "The starter motor is located on the rear LH side of the engine at the cylinder block to oil pan housing split line ... mounted on the LH side of the clutch housing with 3 fixings" }] }
    geometry: { gen: machine, kind: starter, r: 40, len: 140 }

  # ---------------------------------------------------------------- engine harness & connectors
  - id: engine-harness
    parent: engine-assembly
    kind: harness
    name: Engine harness (on-engine run)
    aliases: [engine loom, engine wiring]
    summary: Clipped along the intake side of the camshaft cover under the acoustic cover; branches to the injectors, sensors and glow plugs.
    harness: { connects: [injector-connector-1, injector-connector-4, crank-sensor] }
    explode: { dir: [0, 0.4, 1], dist: 180 }
    verification: { placement: estimated }
    geometry: { gen: tube, r: 9, points: [[-60, 40, 452], [96, 52, 455], [189, 52, 455], [282, 52, 455], [375, 52, 455], [455, 110, 380], [480, 120, 200], [470, 112, -20]] }
  - id: boost-sensor-pigtail
    parent: engine-assembly
    kind: harness
    name: Boost sensor branch
    harness: { connects: [engine-harness, boost-sensor] }
    explode: { dir: [0, 0.4, 1], dist: 180 }
    geometry: { gen: tube, r: 4, points: [[189, 52, 455], [196, 180, 420], [200, 255, 372]] }
  - id: ecm-engine-harness
    kind: harness
    name: Engine harness (ECM to engine)
    summary: Leaves the ECM in the plenum, passes the secondary bulkhead and drops onto the engine.
    harness: { connects: [ecm, engine-harness] }
    explode: { dir: [0, 0, 1], dist: 200 }
    verification: { placement: estimated }
    geometry: { gen: tube, r: 12, points: [[-480, 120, 905], [-420, 120, 925], [-250, 120, 920], [0, 120, 910], [118, 120, 895]] }
  - { id: injector-connector-1, parent: engine-assembly, kind: connector, name: Injector 1 connector, connector: { pins: 2, mates: injector-1 }, placement: { pos: [96, 5, 452] }, explode: { dir: [0, 0, 1], dist: 380 }, geometry: { gen: connector, size: [26, 20, 18], mat: connector-black } }
  - { id: injector-connector-2, parent: engine-assembly, kind: connector, name: Injector 2 connector, connector: { pins: 2, mates: injector-2 }, placement: { pos: [189, 5, 452] }, explode: { dir: [0, 0, 1], dist: 380 }, geometry: { gen: connector, size: [26, 20, 18], mat: connector-black } }
  - { id: injector-connector-3, parent: engine-assembly, kind: connector, name: Injector 3 connector, connector: { pins: 2, mates: injector-3 }, placement: { pos: [282, 5, 452] }, explode: { dir: [0, 0, 1], dist: 380 }, geometry: { gen: connector, size: [26, 20, 18], mat: connector-black } }
  - { id: injector-connector-4, parent: engine-assembly, kind: connector, name: Injector 4 connector, connector: { pins: 2, mates: injector-4 }, placement: { pos: [375, 5, 452] }, explode: { dir: [0, 0, 1], dist: 380 }, geometry: { gen: connector, size: [26, 20, 18], mat: connector-black } }

