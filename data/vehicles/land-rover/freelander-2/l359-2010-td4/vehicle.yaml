wiring:
  id: lhd-080379
  file: wiring/ewd-lhd-080379.json
  source: ewd
  label: VIN 080379–113896
  years: 2008–2009
  # The engineering issue prints almost every wire's length; positions are calculated from it.
  lengths: { file: wiring/ewd-lhd-09my-engineering.json, source: ewd-09my-engineering }
  # Other model years and issues, selectable in the viewer's Wiring tab. Model years come from the parts
  # catalogue's VIN breaks (7H051089 is 2007, 8H103563 is 2008, 9H114084 is 2009).
  publications:
    - { id: lhd-000201, file: wiring/ewd-lhd-000201.json, source: ewd-lhd-000201, label: VIN 000201–057871, years: 2007–2008 }
    - { id: lhd-057872, file: wiring/ewd-lhd-057872.json, source: ewd-lhd-057872, label: VIN 057872–080378, years: "2008" }
    - { id: lhd-09my-engineering, file: wiring/ewd-lhd-09my-engineering.json, source: ewd-09my-engineering, label: "2009 model year, engineering issue (July 2008)", years: "2009" }
  note: >-
    Netlist extracted from the LHD wiring diagrams for VIN serials 080379–113896, the newest set in hand. Parts-catalogue
    VIN breaks show 2010 model-year production starts after serial 119277, so a 2010 car is newer than these diagrams;
    later additions (Stop/Start) are not in them. Wires without a printed far end continue on another sheet.
  # Components the diagrams print that this car cannot have. They are excluded from the coverage count.
  notApplicable:
    - codes: [D233, D234, D235, D236, D237, D238, M343, M344, G158, D361]
      reason: >-
        Petrol (i6 3.2) engine only: ignition coils, intake manifold actuators, ignition capacitor and the fuel pump
        driver module are drawn only on the petrol engine-management and P6 junction-box sheets. The TD4 runs its fuel
        pump through relay R103 in the CJB.
      source: { ref: ewd, locator: "303-14 Petrol 02/05–03/05; 414-01 Battery junction box - P6" }
    - codes: [D294, D307, D308, Y262, T128]
      reason: Automatic transmission only (control module, selector, mechatronics, fluid temperature sensor); this car has the 6-speed manual.
      source: { ref: ewd, locator: "307-01 AUTOMATIC TRANSMISSION 01/01" }
    - codes: [A134, A135]
      reason: Rear side marker lamps are fitted to North American (NAS) vehicles only.
      source: { ref: wsm, locator: "pp. 1642, 1644" }
    - codes: [F210]
      reason: SDARS satellite radio antenna, North America only.
      source: { ref: wsm, locator: "pp. 1594, 1599, 1638" }
    - codes: [T221, T354, T355]
      reason: >-
        Occupant classification system (occupancy module, belt tension sensor, pressure mat) is NAS only; other markets
        use the belt-minder mat (D358).
      source: { ref: wsm, locator: "pp. 2200–2202" }
    - codes: [M345]
      reason: Pyrotechnic steering column collapse actuator, NAS vehicles only.
      source: { ref: wsm, locator: "pp. 2198, 2207" }
    - codes: [D356]
      reason: VICS beacon antenna, Japan only.
      source: { ref: wsm, locator: "pp. 1608, 1610" }
    - codes: [V101, Y371]
      reason: Printed on the sheets as "NOT USED" / "Not installed".
      source: { ref: ewd }
    - codes: [E110]
      reason: Diagram notation ("earth via fixings") for parts grounded through their mounting, not a separate component.
      source: { ref: ewd }

